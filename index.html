
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIENXS - Watch. Share. Discover.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#090d16;
  --panel:#141b2a;
  --text:#f5f7fb;
  --muted:#9ba8bc;
  --accent:#16c784;
  --border:#263247;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:10;
  background:#0d1422;
  padding:14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.logo {font-size:25px;font-weight:900;color:var(--accent)}
button {
  background:var(--accent);
  color:#06140e;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
button.secondary {background:#263247;color:white}
button:disabled {opacity:.5}
input,textarea,select {
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#101827;
  color:white;
  margin:6px 0 12px;
}
textarea {min-height:75px;resize:vertical}
nav {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  border-bottom:1px solid var(--border);
}
nav button {white-space:nowrap}
main {max-width:1100px;margin:auto;padding:15px}
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}
.hidden {display:none!important}
.video-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}
.video-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.video-card video {
  display:block;
  width:100%;
  aspect-ratio:16/9;
  background:black;
  object-fit:contain;
}
.video-info {padding:12px}
.video-info h3 {margin:0 0 7px}
.muted {color:var(--muted);font-size:13px}
#shortsContainer {
  max-width:430px;
  margin:auto;
}
.short-card {
  margin-bottom:20px;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}
.short-card video {
  width:100%;
  height:min(75vh,700px);
  object-fit:contain;
  background:#000;
}
.short-info {padding:12px}
#message {white-space:pre-wrap;margin-top:10px}
footer {
  text-align:center;
  padding:25px;
  color:var(--muted);
}
</style>
</head>

<body>
<header>
  <div class="logo">JIENXS</div>
  <button id="authButton" onclick="showAuth()">Sign in</button>
</header>

<nav>
  <button onclick="showPage('home')">Home</button>
  <button onclick="showPage('shorts')">Shorts</button>
  <button onclick="showPage('upload')">Upload</button>
  <button onclick="filterCategory('All')">All videos</button>
  <button onclick="filterCategory('Football')">Football</button>
  <button onclick="filterCategory('Others')">Others</button>
</nav>

<main>
  <section id="homePage">
    <div class="panel">
      <h2>Discover videos</h2>
      <input id="searchInput" placeholder="Search videos..." oninput="renderVideos()">
      <p class="muted">Watch. Share. Discover.</p>
    </div>
    <div id="videoGrid" class="video-grid"></div>
  </section>

  <section id="shortsPage" class="hidden">
    <h2>JIENXS Shorts</h2>
    <div id="shortsContainer"></div>
  </section>

  <section id="uploadPage" class="hidden">
    <div class="panel">
      <h2>Upload a video</h2>
      <p class="muted">Sign in before uploading your video.</p>

      <label>Video title</label>
      <input id="videoTitle" placeholder="Enter video title">

      <label>Description</label>
      <textarea id="videoDescription" placeholder="Describe your video"></textarea>

      <label>Category</label>
      <select id="videoCategory">
        <option value="Football">Football</option>
        <option value="Others">Others</option>
      </select>

      <label>Select video</label>
      <input id="videoFile" type="file" accept="video/*">

      <button id="uploadButton" onclick="uploadVideo()">Upload video</button>
      <div id="message"></div>
    </div>
  </section>

  <section id="authPage" class="hidden">
    <div class="panel">
      <h2>JIENXS Account</h2>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <input id="displayName" placeholder="Your display name (for sign up)">
      <button onclick="signUp()">Create account</button>
      <button class="secondary" onclick="signIn()">Sign in</button>
      <button class="secondary" onclick="resetPassword()">Reset password</button>
      <div id="authMessage"></div>
    </div>
  </section>
</main>

<footer>JIENXS — Watch. Share. Discover.</footer>

<script>
const SUPABASE_URL = "https://duwdfekgjcleihrimxrf.supabase.co";
const SUPABASE_KEY = "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const STORAGE_BUCKET = "jienxs";

let currentUser = null;
let allVideos = [];
let activeCategory = "All";

function showPage(page) {
  ["homePage","shortsPage","uploadPage","authPage"].forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });

  const pageMap = {
    home:"homePage",
    shorts:"shortsPage",
    upload:"uploadPage",
    auth:"authPage"
  };

  document.getElementById(pageMap[page]).classList.remove("hidden");

  if (page === "shorts") renderShorts();
}

function showAuth() {
  showPage("auth");
}

function showMessage(id, message) {
  document.getElementById(id).textContent = message;
}

async function updateAuth() {
  const { data } = await supabaseClient.auth.getSession();
  currentUser = data.session ? data.session.user : null;

  const button = document.getElementById("authButton");

  if (currentUser) {
    button.textContent = "Sign out";
    button.onclick = signOut;
  } else {
    button.textContent = "Sign in";
    button.onclick = showAuth;
  }
}

async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const displayName = document.getElementById("displayName").value.trim();

  if (!email || !password) {
    showMessage("authMessage","Enter your email and password.");
    return;
  }

  if (password.length < 6) {
    showMessage("authMessage","Password must have at least 6 characters.");
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: displayName || email.split("@")[0] }
    }
  });

  if (error) {
    showMessage("authMessage",error.message);
    return;
  }

  showMessage("authMessage","Account created. Check your email if confirmation is required, then sign in.");
  await updateAuth();
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage("authMessage",error.message);
    return;
  }

  await updateAuth();
  showMessage("authMessage","You are signed in successfully.");
  showPage("home");
}

async function signOut() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  await updateAuth();
  alert("You have signed out.");
}

async function resetPassword() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("authMessage","Enter your email address first.");
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

  showMessage(
    "authMessage",
    error ? error.message : "Password reset instructions have been sent if the account exists."
  );
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

async function loadVideos() {
  const grid = document.getElementById("videoGrid");
  grid.innerHTML = "<p>Loading videos...</p>";

  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .eq("status","published")
    .order("created_at",{ascending:false});

  if (error) {
    grid.innerHTML = "<p>Could not load videos: " +
      escapeHTML(error.message) + "</p>";
    return;
  }

  allVideos = data || [];
  renderVideos();
  renderShorts();
}

function renderVideos() {
  const grid = document.getElementById("videoGrid");
  const search = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allVideos.filter(video => {
    const matchesCategory =
      activeCategory === "All" || video.category === activeCategory;

    const matchesSearch =
      (video.title || "").toLowerCase().includes(search) ||
      (video.description || "").toLowerCase().includes(search) ||
      (video.creator_name || "").toLowerCase().includes(search);

    return matchesCategory && matchesSearch;
  });

  if (!filtered.length) {
    grid.innerHTML = "<p>No videos found. Be the first to upload!</p>";
    return;
  }

  grid.innerHTML = filtered.map(video => `
    <article class="video-card">
      <video
        controls
        playsinline
        preload="metadata"
        src="${escapeHTML(video.video_url)}"
      ></video>
      <div class="video-info">
        <h3>${escapeHTML(video.title)}</h3>
        <p>${escapeHTML(video.description || "")}</p>
        <p class="muted">
          ${escapeHTML(video.creator_name || "JIENXS creator")}
          · ${escapeHTML(video.category || "Others")}
        </p>
      </div>
    </article>
  `).join("");
}

function renderShorts() {
  const container = document.getElementById("shortsContainer");

  if (!allVideos.length) {
    container.innerHTML = "<p>No videos available yet.</p>";
    return;
  }

  container.innerHTML = allVideos.map(video => `
    <article class="short-card">
      <video
        controls
        playsinline
        preload="metadata"
        src="${escapeHTML(video.video_url)}"
      ></video>
      <div class="short-info">
        <h3>${escapeHTML(video.title)}</h3>
        <p>${escapeHTML(video.description || "")}</p>
        <p class="muted">
          ${escapeHTML(video.creator_name || "JIENXS creator")}
        </p>
      </div>
    </article>
  `).join("");
}

function filterCategory(category) {
  activeCategory = category;
  showPage("home");
  renderVideos();
}

async function uploadVideo() {
  const button = document.getElementById("uploadButton");
  const title = document.getElementById("videoTitle").value.trim();
  const description = document.getElementById("videoDescription").value.trim();
  const category = document.getElementById("videoCategory").value;
  const file = document.getElementById("videoFile").files[0];

  if (!currentUser) {
    showMessage("message","Please sign in before uploading.");
    showPage("auth");
    return;
  }

  if (!title || !file) {
    showMessage("message","Enter a title and select a video.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage("message","Please select a valid video file.");
    return;
  }

  if (file.size > 500 * 1024 * 1024) {
    showMessage("message","This video is larger than 500 MB.");
    return;
  }

  button.disabled = true;
  button.textContent = "Uploading...";
  showMessage("message","Uploading your video. Please wait...");

  let filePath = null;

  try {
    const safeName = file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");

    filePath = currentUser.id + "/" + Date.now() + "_" + safeName;

    const { error: storageError } = await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .upload(filePath,file,{
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      });

    if (storageError) throw storageError;

    const { data: urlData } = supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(filePath);

    const publicUrl = urlData.publicUrl;

    const creatorName =
      currentUser.user_metadata?.full_name ||
      currentUser.user_metadata?.name ||
      currentUser.email?.split("@")[0] ||
      "JIENXS Creator";

    const { error: insertError } = await supabaseClient
      .from("videos")
      .insert({
        title: title,
        description: description,
        category: category,
        video_url: publicUrl,
        storage_path: filePath,
        creator_id: currentUser.id,
        creator_name: creatorName,
        status: "published"
      });

    if (insertError) throw insertError;

    showMessage("message","Your video was uploaded successfully!");
    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoFile").value = "";

    await loadVideos();
    showPage("home");

  } catch (error) {
    console.error("JIENXS upload error:",error);

    if (filePath) {
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([filePath]);
    }

    showMessage("message","Upload failed: " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "Upload video";
  }
}

supabaseClient.auth.onAuthStateChange(() => {
  updateAuth();
});

async function startJIENXS() {
  await updateAuth();
  await loadVideos();
}

startJIENXS();
</script>
</body>
</html>
