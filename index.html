
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jienxs - Watch. Share. Connect.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151923;
    }
    .logo { color: #35d07f; font-size: 26px; font-weight: bold; }
    button {
      background: #35d07f;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }
    main { padding: 25px; max-width: 1000px; margin: auto; }
    h1 { font-size: 38px; }
    .green { color: #35d07f; }
    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }
    .categories span {
      background: #202633;
      padding: 12px 18px;
      border-radius: 20px;
    }
    .welcome {
      background: #171e29;
      padding: 30px;
      border-radius: 15px;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">▶ JIENXS</div>
    <button>Join Now</button>
  </header>

  <main>
    <div class="welcome">
      <h1>Welcome to <span class="green">Jienxs</span></h1>
      <p>Watch amazing videos. Share your talent.
      Connect with creators around the world.</p>
      <button>Explore Videos</button>
    </div>

    <h2>Discover Videos</h2>
    <div class="categories">
      <span>⚽ Football</span>
      <span>🎮 Gaming</span>
      <span>🔥 Skills</span>
      <span>🎬 Other</span>
    </div>

    <h2>Popular on Jienxs</h2>
    <p>Your video feed is coming soon!</p>
  </main>

  <footer>© 2026 Jienxs. Watch. Share. Connect.</footer>
</body>
</html>
