<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIENXS - Watch. Share. Discover.</title>

<style>
:root {
  --bg: #0b0b0f;
  --panel: #17171f;
  --panel2: #20202a;
  --text: #ffffff;
  --muted: #a4a4b0;
  --accent: #ff304f;
  --border: #30303b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  height: 62px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #111116;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 1px;
}

.search-area {
  display: flex;
  flex: 1;
  max-width: 500px;
}

.search-area input {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 20px 0 0 20px;
  background: var(--panel);
  color: white;
}

.search-area button {
  border-radius: 0 20px 20px 0;
}

button {
  border: none;
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
  background: #111116;
  border-bottom: 1px solid var(--border);
}

nav button {
  white-space: nowrap;
  background: var(--panel2);
}

nav button.active {
  background: var(--accent);
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin-top: 8px;
}

.category-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0 16px;
}

.category-bar button {
  background: var(--panel2);
  white-space: nowrap;
}

.category-bar button.active {
  background: var(--accent);
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}

.video-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  min-width: 0;
}

.video-card video {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: block;
  background: black;
  object-fit: contain;
}

.video-info {
  padding: 12px;
}

.video-info h3 {
  margin: 0 0 8px;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.video-info p {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.video-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.video-actions button {
  background: var(--panel2);
  font-size: 12px;
  padding: 8px 10px;
}

.video-actions button:hover {
  background: var(--accent);
}

.video-actions .delete-button {
  background: #8b202e;
}

.form-box {
  max-width: 600px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin: 15px auto;
}

.form-box input,
.form-box textarea,
.form-box select {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
  color: white;
}

.form-box textarea {
  min-height: 90px;
  resize: vertical;
}

.form-box button {
  width: 100%;
  margin-top: 8px;
}

.message {
  margin: 12px 0;
  color: #ffd166;
  overflow-wrap: anywhere;
}

.muted {
  color: var(--muted);
}

.shorts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.shorts-grid .video-card video {
  aspect-ratio: 9 / 16;
  max-height: 520px;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  header {
    padding: 0 9px;
  }

  .logo {
    font-size: 20px;
  }

  header > button {
    padding: 9px;
    font-size: 12px;
  }

  main {
    padding: 10px;
  }

  .video-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo">JIENXS</div>

  <div class="search-area">
    <input id="searchInput" type="search" placeholder="Search videos...">
    <button id="searchButton">Search</button>
  </div>

  <button id="headerAccountButton">Account</button>
</header>

<nav>
  <button class="nav-button active" data-page="homePage">Home</button>
  <button class="nav-button" data-page="shortsPage">Shorts</button>
  <button class="nav-button" data-page="explorePage">Explore</button>
  <button class="nav-button" data-page="uploadPage">Upload</button>
  <button class="nav-button" data-page="accountPage">Account</button>
</nav>

<main>

  <section id="homePage" class="page active">
    <h2>Discover videos</h2>

    <div class="category-bar" id="homeCategories">
      <button class="active" data-category="All">All</button>
      <button data-category="Football">Football</button>
      <button data-category="Sports">Sports</button>
      <button data-category="Entertainment">Entertainment</button>
      <button data-category="Music">Music</button>
      <button data-category="Others">Others</button>
    </div>

    <div id="homeMessage" class="message">Loading videos...</div>
    <div id="homeVideos" class="video-grid"></div>
  </section>

  <section id="shortsPage" class="page">
    <h2>JIENXS Shorts</h2>
    <p class="muted">Watch short videos from the community.</p>
    <div id="shortsMessage" class="message"></div>
    <div id="shortsVideos" class="shorts-grid"></div>
  </section>

  <section id="explorePage" class="page">
    <h2>Explore JIENXS</h2>
    <p class="muted">Discover videos from different categories.</p>

    <div class="category-bar" id="exploreCategories">
      <button class="active" data-category="All">All</button>
      <button data-category="Football">Football</button>
      <button data-category="Sports">Sports</button>
      <button data-category="Entertainment">Entertainment</button>
      <button data-category="Music">Music</button>
      <button data-category="Others">Others</button>
    </div>

    <div id="exploreMessage" class="message"></div>
    <div id="exploreVideos" class="video-grid"></div>
  </section>

  <section id="uploadPage" class="page">
    <h2>Upload a video</h2>

    <div class="form-box">
      <p class="muted">Share your videos with the JIENXS community.</p>

      <form id="uploadForm">
        <input
          id="videoTitle"
          type="text"
          placeholder="Video title"
          required
          maxlength="120"
        >

        <textarea
          id="videoDescription"
          placeholder="Video description"
        ></textarea>

        <select id="videoCategory" required>
          <option value="Football">Football</option>
          <option value="Sports">Sports</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Music">Music</option>
          <option value="Others">Others</option>
        </select>

        <label for="videoFile">Choose your video:</label>
        <input
          id="videoFile"
          type="file"
          accept="video/*"
          required
        >

        <button id="uploadButton" type="submit">Upload video</button>
      </form>

      <div id="uploadMessage" class="message"></div>
    </div>
  </section>

  <section id="accountPage" class="page">
    <h2>Your account</h2>

    <div id="signedOutBox" class="form-box">
      <h3>Sign in</h3>

      <form id="loginForm">
        <input
          id="loginEmail"
          type="email"
          placeholder="Email address"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">Sign in</button>
      </form>

      <hr>

      <h3>Create an account</h3>

      <form id="signupForm">
        <input
          id="signupName"
          type="text"
          placeholder="Your name"
          required
        >

        <input
          id="signupEmail"
          type="email"
          placeholder="Email address"
          required
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password (at least 6 characters)"
          minlength="6"
          required
        >

        <button type="submit">Create account</button>
      </form>

      <div id="authMessage" class="message"></div>
    </div>

    <div id="signedInBox" class="form-box hidden">
      <h3 id="accountName">Welcome</h3>
      <p id="accountEmail" class="muted"></p>
      <button id="logoutButton">Sign out</button>
    </div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://duwdfekgjcleihrimxrf.supabase.co";
const SUPABASE_KEY = "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const STORAGE_BUCKET = "jienxs";

let currentUser = null;
let allVideos = [];
let activeCategory = "All";
let searchTerm = "";

const $ = (id) => document.getElementById(id);

function showMessage(id, message) {
  const element = $(id);
  if (element) element.textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function showPage(pageId) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === pageId);
  });

  document.querySelectorAll(".nav-button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === pageId
    );
  });

  if (pageId === "uploadPage" && !currentUser) {
    showMessage("uploadMessage", "Please sign in before uploading a video.");
  }
}

function filteredVideos() {
  return allVideos.filter(video => {
    const matchesCategory =
      activeCategory === "All" ||
      video.category === activeCategory;

    const searchText = (
      (video.title || "") + " " +
      (video.description || "") + " " +
      (video.creator_name || "")
    ).toLowerCase();

    return matchesCategory && searchText.includes(searchTerm);
  });
}

function createVideoCard(video, shortMode = false) {
  const card = document.createElement("article");
  card.className = "video-card";

  const title = escapeHTML(video.title || "Untitled video");
  const description = escapeHTML(video.description || "");
  const creator = escapeHTML(video.creator_name || "JIENXS user");
  const category = escapeHTML(video.category || "Others");
  const videoUrl = escapeHTML(video.video_url || "");

  const isOwner =
    currentUser && currentUser.id === video.creator_id;

  card.innerHTML = `
    <video
      src="${videoUrl}"
      controls
      playsinline
      preload="metadata"
    ></video>

    <div class="video-info">
      <h3>${title}</h3>
      <p>${description}</p>
      <p>By ${creator} · ${category}</p>

      <div class="video-actions">
        <button class="like-button">Like</button>
        <button class="comment-button">Comment</button>
        <button class="share-button">Share</button>
        ${isOwner ? '<button class="delete-button">Delete</button>' : ""}
      </div>

      <div class="message comment-message"></div>
    </div>
  `;

  card.querySelector(".like-button").addEventListener("click", () => {
    likeVideo(video.id);
  });

  card.querySelector(".comment-button").addEventListener("click", () => {
    commentOnVideo(video.id, card);
  });

  card.querySelector(".share-button").addEventListener("click", () => {
    shareVideo(video);
  });

  const deleteButton = card.querySelector(".delete-button");

  if (deleteButton) {
    deleteButton.addEventListener("click", () => {
      deleteVideo(video);
    });
  }

  return card;
}

function renderVideos() {
  const videos = filteredVideos();

  $("homeVideos").replaceChildren();
  $("exploreVideos").replaceChildren();
  $("shortsVideos").replaceChildren();

  if (videos.length === 0) {
    showMessage("homeMessage", "No videos found.");
    showMessage("exploreMessage", "No videos found.");
    showMessage("shortsMessage", "No short videos found.");
    return;
  }

  showMessage("homeMessage", "");
  showMessage("exploreMessage", "");
  showMessage("shortsMessage", "");

  videos.forEach(video => {
    $("homeVideos").appendChild(createVideoCard(video));
    $("exploreVideos").appendChild(createVideoCard(video));

    // Shorts displays the same uploaded videos in a vertical layout.
    $("shortsVideos").appendChild(createVideoCard(video, true));
  });
}

async function loadVideos() {
  showMessage("homeMessage", "Loading videos...");

  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .eq("status", "approved")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Video loading error:", error);
    showMessage("homeMessage", "Could not load videos: " + error.message);
    return;
  }

  allVideos = data || [];
  renderVideos();
}

function setCategory(category) {
  activeCategory = category;

  document.querySelectorAll(".category-bar button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === category
    );
  });

  renderVideos();
}

document.querySelectorAll(".nav-button").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});

$("headerAccountButton").addEventListener("click", () => {
  showPage("accountPage");
});

document.querySelectorAll(".category-bar").forEach(bar => {
  bar.querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      setCategory(button.dataset.category);
    });
  });
});

function runSearch() {
  searchTerm = $("searchInput").value.trim().toLowerCase();
  renderVideos();
}

$("searchButton").addEventListener("click", runSearch);

$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") runSearch();
});
  async function updateAccountDisplay() {
  if (currentUser) {
    $("signedOutBox").classList.add("hidden");
    $("signedInBox").classList.remove("hidden");

    const name =
      currentUser.user_metadata?.username ||
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "JIENXS user";

    $("accountName").textContent = "Welcome, " + name;
    $("accountEmail").textContent = currentUser.email || "";
  } else {
    $("signedOutBox").classList.remove("hidden");
    $("signedInBox").classList.add("hidden");
  }

  renderVideos();
}

async function signUp(event) {
  event.preventDefault();

  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  showMessage("authMessage", "Creating your account...");

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      data: {
        username: name,
        full_name: name
      }
    }
  });

  if (error) {
    showMessage("authMessage", error.message);
    return;
  }

  if (data.session) {
    currentUser = data.user;
    await updateAccountDisplay();
    showMessage("authMessage", "Your account has been created.");
  } else {
    showMessage(
      "authMessage",
      "Account created. Check your email if confirmation is required, then sign in."
    );
  }

  $("signupForm").reset();
}

async function signIn(event) {
  event.preventDefault();

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  showMessage("authMessage", "Signing in...");

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage("authMessage", error.message);
    return;
  }

  currentUser = data.user;
  await updateAccountDisplay();
  showMessage("authMessage", "You are signed in.");
  $("loginForm").reset();
}

async function signOut() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("Sign out failed: " + error.message);
    return;
  }

  currentUser = null;
  await updateAccountDisplay();
}

$("signupForm").addEventListener("submit", signUp);
$("loginForm").addEventListener("submit", signIn);
$("logoutButton").addEventListener("click", signOut);

async function likeVideo(videoId) {
  if (!currentUser) {
    alert("Please sign in to like videos.");
    showPage("accountPage");
    return;
  }

  const { error } = await supabaseClient
    .from("likes")
    .insert({
      video_id: videoId,
      user_id: currentUser.id
    });

  if (error) {
    if (error.code === "23505") {
      alert("You have already liked this video.");
    } else {
      alert("Could not like video: " + error.message);
    }
    return;
  }

  alert("Video liked!");
}

async function commentOnVideo(videoId, card) {
  if (!currentUser) {
    alert("Please sign in to comment.");
    showPage("accountPage");
    return;
  }

  const comment = prompt("Write your comment:");

  if (!comment || !comment.trim()) return;

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      video_id: videoId,
      user_id: currentUser.id,
      content: comment.trim()
    });

  const message = card.querySelector(".comment-message");

  if (error) {
    message.textContent = "Comment failed: " + error.message;
    return;
  }

  message.textContent = "Your comment was posted.";
}

async function shareVideo(video) {
  const shareUrl = video.video_url;

  if (navigator.share) {
    try {
      await navigator.share({
        title: video.title || "JIENXS video",
        text: "Watch this video on JIENXS",
        url: shareUrl
      });
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Share error:", error);
      }
    }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(shareUrl);
      alert("Video link copied.");
    } catch (error) {
      alert("Could not copy the link. You can copy this URL: " + shareUrl);
    }
  } else {
    alert("Copy this video link: " + shareUrl);
  }
                                                            }
  async function uploadVideo(event) {
  event.preventDefault();

  if (!currentUser) {
    showMessage("uploadMessage", "Please sign in before uploading.");
    showPage("accountPage");
    return;
  }

  const title = $("videoTitle").value.trim();
  const description = $("videoDescription").value.trim();
  const category = $("videoCategory").value;
  const file = $("videoFile").files[0];

  if (!title || !file) {
    showMessage("uploadMessage", "Enter a title and select a video.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage("uploadMessage", "Please select a valid video file.");
    return;
  }

  const uploadButton = $("uploadButton");
  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";

  showMessage("uploadMessage", "Uploading your video. Please wait...");

  try {
    const safeFileName = file.name
      .replace(/[^a-zA-Z0-9._-]/g, "_");

    const filePath =
      currentUser.id + "/" + Date.now() + "-" + safeFileName;

    // STEP 1: Upload the actual video to Supabase Storage.
    const { error: storageError } = await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (storageError) {
      throw storageError;
    }

    // STEP 2: Get the public URL of the uploaded video.
    const { data: publicData } = supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(filePath);

    const publicUrl = publicData.publicUrl;

    const creatorName =
      currentUser.user_metadata?.username ||
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "JIENXS user";

    // STEP 3: Save the video details and storage path in the database.
    const { error: insertError } = await supabaseClient
      .from("videos")
      .insert({
        title: title,
        description: description,
        category: category,
        video_url: publicUrl,
        storage_path: filePath,
        creator_id: currentUser.id,
        creator_name: creatorName,
        status: "approved"
      });

    if (insertError) {
      // Remove the uploaded file if the database insert fails.
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([filePath]);

      throw insertError;
    }

    showMessage("uploadMessage", "Video uploaded successfully!");

    $("uploadForm").reset();

    await loadVideos();

    showPage("homePage");

  } catch (error) {
    console.error("Upload error:", error);

    showMessage(
      "uploadMessage",
      "Upload failed: " + (error.message || "Unknown error")
    );

  } finally {
    uploadButton.disabled = false;
    uploadButton.textContent = "Upload video";
  }
}

$("uploadForm").addEventListener("submit", uploadVideo);


// DELETE A VIDEO AND ITS STORAGE FILE
async function deleteVideo(video) {
  if (!currentUser) {
    alert("Please sign in first.");
    return;
  }

  if (video.creator_id !== currentUser.id) {
    alert("You can only delete your own videos.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this video?"
  );

  if (!confirmed) return;

  try {
    // Remove the actual file from Supabase Storage.
    if (video.storage_path) {
      const { error: storageError } = await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([video.storage_path]);

      if (storageError) {
        throw storageError;
      }
    }

    // Remove the video record from the database.
    const { error: deleteError } = await supabaseClient
      .from("videos")
      .delete()
      .eq("id", video.id)
      .eq("creator_id", currentUser.id);

    if (deleteError) {
      throw deleteError;
    }

    alert("Video deleted successfully.");

    await loadVideos();

  } catch (error) {
    console.error("Delete error:", error);
    alert("Could not delete video: " + error.message);
  }
}


// CHECK THE CURRENT LOGIN SESSION
async function initializeJIENXS() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
      console.error("Session error:", error);
    }

    currentUser = data?.session?.user || null;

    await updateAccountDisplay();
    await loadVideos();

  } catch (error) {
    console.error("JIENXS initialization error:", error);
    showMessage("homeMessage", "Could not start JIENXS: " + error.message);
  }
}


// KEEP ACCOUNT DISPLAY UPDATED AFTER SIGN IN OR SIGN OUT
supabaseClient.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;

  setTimeout(() => {
    updateAccountDisplay();
    renderVideos();
  }, 0);
});


// START JIENXS
initializeJIENXS();

</script>

</body>
</html>
