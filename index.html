
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>JIENXS - Watch. Share. Discover.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#080808;
  --panel:#151515;
  --panel2:#202020;
  --accent:#ff3158;
  --text:#fff;
  --muted:#aaa;
  --border:#303030;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  padding-bottom:85px;
}
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }

header {
  height:62px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#101010;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}
.logo {
  color:var(--accent);
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}
.header-button {
  background:var(--accent);
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
}
main {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:15px;
}
.page { display:none; }
.page.active { display:block; }
h2 { margin-top:8px; }
.muted { color:var(--muted); }

.search-box {
  width:100%;
  padding:13px;
  border-radius:25px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  margin:12px 0;
  outline:none;
}
.category-list {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:8px 0 14px;
}
.category-list button {
  white-space:nowrap;
  padding:9px 15px;
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
  border-radius:22px;
}
.category-list button.active {
  background:var(--accent);
  border-color:var(--accent);
}

.video-grid,.explore-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.video-card,.shorts-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  margin-bottom:15px;
  min-width:0;
}
.video-card video,.shorts-card video {
  display:block;
  width:100%;
  max-height:480px;
  background:#000;
  object-fit:contain;
}
.video-details { padding:12px; }
.video-title {
  font-weight:bold;
  font-size:15px;
  margin-bottom:7px;
  overflow-wrap:anywhere;
}
.video-description {
  color:var(--muted);
  font-size:13px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.video-creator {
  color:var(--muted);
  font-size:12px;
  margin-bottom:9px;
}
.video-actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-top:12px;
}
.action-button {
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
  padding:8px 11px;
  border-radius:20px;
  font-size:13px;
}
.action-button.liked {
  color:var(--accent);
  border-color:var(--accent);
}
.like-count { font-size:13px; color:var(--muted); }

.inline-comments {
  border-top:1px solid var(--border);
  margin-top:12px;
  padding-top:12px;
}
.inline-comments h4 { margin:0 0 10px; }
.comment-list {
  display:flex;
  flex-direction:column;
  gap:9px;
}
.comment-item {
  background:#202020;
  border-radius:9px;
  padding:10px;
  overflow-wrap:anywhere;
}
.comment-name { font-size:13px; font-weight:bold; }
.comment-content {
  font-size:14px;
  margin:6px 0;
  white-space:pre-wrap;
}
.comment-date { font-size:11px; color:var(--muted); }
.comment-delete {
  background:transparent;
  color:var(--accent);
  border:0;
  padding:5px 0;
  font-size:12px;
}
.comment-form {
  display:flex;
  gap:7px;
  margin-top:10px;
}
.comment-form input {
  min-width:0;
  flex:1;
  padding:11px;
  background:#202020;
  color:white;
  border:1px solid var(--border);
  border-radius:20px;
}
.comment-form button {
  background:var(--accent);
  color:white;
  border:0;
  border-radius:20px;
  padding:0 14px;
}

.shorts-feed { max-width:480px; margin:auto; }
.shorts-card video { max-height:72vh; }
.form-panel {
  background:var(--panel);
  padding:16px;
  border:1px solid var(--border);
  border-radius:13px;
  margin:15px 0;
}
.form-panel input,.form-panel textarea,.form-panel select {
  width:100%;
  padding:12px;
  margin:7px 0 13px;
  color:white;
  background:#202020;
  border:1px solid var(--border);
  border-radius:8px;
}
.form-panel textarea { min-height:90px; resize:vertical; }
.primary-button {
  background:var(--accent);
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 17px;
  font-weight:bold;
}
.secondary-button {
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 15px;
}
.button-row { display:flex; flex-wrap:wrap; gap:9px; }
.message {
  display:none;
  background:#202020;
  border:1px solid var(--accent);
  padding:11px;
  border-radius:8px;
  margin:12px 0;
  overflow-wrap:anywhere;
}
.message.show { display:block; }
.empty-state {
  color:var(--muted);
  text-align:center;
  padding:30px 10px;
  grid-column:1/-1;
}

/* SAME FIXED BOTTOM NAVIGATION */
.bottom-nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:70px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:#111;
  border-top:1px solid #333;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item {
  flex:1;
  height:100%;
  background:transparent;
  color:#aaa;
  border:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:11px;
}
.nav-item .nav-icon { font-size:21px; }
.nav-item.active { color:var(--accent); font-weight:bold; }

@media(min-width:700px) {
  .video-grid,.explore-grid {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
@media(max-width:420px) {
  main { padding:10px; }
  .video-grid,.explore-grid { grid-template-columns:1fr; }
  .bottom-nav { height:68px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">JIENXS</div>
  <button class="header-button" id="authButton">Account</button>
</header>

<main>
  <div id="messageBox" class="message"></div>

  <section id="home" class="page active">
    <h2>Discover videos</h2>
    <input id="searchInput" class="search-box"
      type="search" placeholder="Search videos...">
    <div class="category-list">
      <button class="active" data-category="All">All</button>
      <button data-category="Football">Football</button>
      <button data-category="Sports">Sports</button>
      <button data-category="Entertainment">Entertainment</button>
      <button data-category="Music">Music</button>
      <button data-category="Others">Others</button>
    </div>
    <div id="videoGrid" class="video-grid">
      <div class="empty-state">Loading videos...</div>
    </div>
  </section>

  <section id="shorts" class="page">
    <h2>🎬 JIENXS Shorts</h2>
    <p class="muted">Watch short videos and discover something new.</p>
    <div id="shortsFeed" class="shorts-feed">
      <div class="empty-state">Loading Shorts...</div>
    </div>
  </section>

  <section id="explore" class="page">
    <h2>🌍 Explore</h2>
    <p class="muted">Discover videos from across JIENXS.</p>
    <div id="exploreGrid" class="explore-grid"></div>
  </section>

  <section id="upload" class="page">
    <h2>⬆ Upload a video</h2>
    <div class="form-panel">
      <label for="videoTitle">Video title</label>
      <input id="videoTitle" type="text" placeholder="Enter video title">

      <label for="videoCategory">Category</label>
      <select id="videoCategory">
        <option value="Football">Football</option>
        <option value="Sports">Sports</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Music">Music</option>
        <option value="Others">Others</option>
      </select>

      <label for="videoDescription">Description</label>
      <textarea id="videoDescription" placeholder="Describe your video..."></textarea>

      <label for="videoFile">Choose video</label>
      <input id="videoFile" type="file" accept="video/*">

      <button id="uploadButton" class="primary-button">Upload Video</button>
      <p class="muted">Maximum upload size: 100 MB.</p>
      <div id="uploadMessage" class="message"></div>
    </div>
  </section>

  <section id="account" class="page">
    <h2>👤 Your account</h2>
    <div class="form-panel">
      <h3>Create an account</h3>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <div class="button-row">
        <button id="createAccountButton" class="primary-button">Sign Up</button>
        <button id="signInButton" class="secondary-button">Sign In</button>
      </div>
    </div>

    <div class="form-panel">
      <h3>Your profile</h3>
      <p id="identityPreview" class="muted">Not signed in</p>
      <p id="handlePreview" class="muted"></p>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username">
      <label for="nickname">Display name</label>
      <input id="nickname" type="text" placeholder="Your display name">
      <div class="button-row">
        <button id="saveProfileButton" class="primary-button">Save Profile</button>
        <button id="signOutButton" class="secondary-button">Sign Out</button>
      </div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon">⌂</span><span>Home</span>
  </button>
  <button class="nav-item" data-page="shorts">
    <span class="nav-icon">🎬</span><span>Shorts</span>
  </button>
  <button class="nav-item" data-page="explore">
    <span class="nav-icon">🌍</span><span>Explore</span>
  </button>
  <button class="nav-item" data-page="upload">
    <span class="nav-icon">⬆</span><span>Upload</span>
  </button>
  <button class="nav-item" data-page="account">
    <span class="nav-icon">👤</span><span>Account</span>
  </button>
</nav>

<script>
        
// ============================================
// JIENXS PART 2: SUPABASE CONNECTION & CORE DATA
// ============================================

// Your existing Supabase project
const SUPABASE_URL = "https://duwdfekgjcleihrimxrf.supabase.co";
const SUPABASE_KEY = "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let allVideos = [];
let videoLikes = {};
let selectedCategory = "All";
let searchTerm = "";

// Show messages
function showMessage(message, target = "messageBox") {
  const box = document.getElementById(target);
  if (!box) return;

  box.textContent = message;
  box.classList.add("show");

  clearTimeout(box.hideTimer);
  box.hideTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 5000);
}

// Escape text before inserting it into HTML
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

// Format dates
function formatDate(date) {
  if (!date) return "";
  return new Date(date).toLocaleDateString();
}

// Switch between pages
function showPage(pageName) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === pageName);
  });

  document.querySelectorAll(".nav-item").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === pageName
    );
  });

  if (pageName === "shorts") renderShorts();
  if (pageName === "explore") renderExplore();

  if (pageName === "upload" && !currentUser) {
    showMessage("Please sign in before uploading videos.");
  }
}

// Load videos from Supabase
async function loadVideos() {
  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .eq("status", "approved")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Video loading error:", error);
    showMessage("Could not load videos: " + error.message);
    allVideos = [];
  } else {
    allVideos = data || [];
  }

  await loadVideoLikes();
  renderVideos();
  renderShorts();
  renderExplore();
}

// Load all like records for displayed videos
async function loadVideoLikes() {
  videoLikes = {};

  const videoIds = allVideos.map(video => video.id).filter(Boolean);

  if (!videoIds.length) return;

  const { data, error } = await supabaseClient
    .from("likes")
    .select("video_id,user_id")
    .in("video_id", videoIds);

  if (error) {
    console.error("Like loading error:", error);
    return;
  }

  (data || []).forEach(like => {
    if (!videoLikes[like.video_id]) {
      videoLikes[like.video_id] = {
        count: 0,
        users: []
      };
    }

    videoLikes[like.video_id].count++;
    videoLikes[like.video_id].users.push(like.user_id);
  });
}

// Get a video's like count
function getLikeCount(videoId) {
  return videoLikes[videoId]?.count || 0;
}

// Check whether current user liked a video
function userLikedVideo(videoId) {
  if (!currentUser) return false;

  return (
    videoLikes[videoId]?.users.includes(currentUser.id) || false
  );
}

// Refresh likes from database
async function refreshLikes() {
  await loadVideoLikes();
  renderVideos();
  renderShorts();
  renderExplore();
}

// Load current profile
async function loadProfile() {
  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id,username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile loading error:", error);
    return;
  }

  if (data) {
    document.getElementById("username").value = data.username || "";
    document.getElementById("nickname").value = data.nickname || "";
    document.getElementById("handlePreview").textContent =
      data.username ? "@" + data.username : "";
  }
}

// Save profile
async function saveProfile() {
  if (!currentUser) {
    showMessage("Please sign in first.");
    return;
  }

  const username = document.getElementById("username").value.trim();
  const nickname = document.getElementById("nickname").value.trim();

  if (!username) {
    showMessage("Please enter a username.");
    return;
  }

  const { error } = await supabaseClient
    .from("profiles")
    .upsert({
      id: currentUser.id,
      username,
      nickname
    }, { onConflict: "id" });

  if (error) {
    showMessage("Profile could not be saved: " + error.message);
    return;
  }

  document.getElementById("handlePreview").textContent = "@" + username;
  showMessage("Profile saved successfully!");
}

// Update account display
function updateAccountDisplay() {
  const preview = document.getElementById("identityPreview");
  const authButton = document.getElementById("authButton");

  if (currentUser) {
    preview.textContent = "Signed in as " + currentUser.email;
    authButton.textContent = "My Account";
  } else {
    preview.textContent = "Not signed in";
    authButton.textContent = "Account";
    document.getElementById("handlePreview").textContent = "";
  }
}

// Sign up
async function createAccount() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    showMessage("Sign up failed: " + error.message);
    return;
  }

  if (data.session) {
    currentUser = data.user;
    updateAccountDisplay();
    await loadProfile();
    showMessage("Account created successfully!");
  } else {
    showMessage("Account created. Check your email to confirm, then sign in.");
  }
}

// Sign in
async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage("Sign in failed: " + error.message);
    return;
  }

  currentUser = data.user;
  updateAccountDisplay();
  await loadProfile();
  await refreshLikes();
  showMessage("Welcome back!");
}

// Sign out
async function signOut() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    showMessage("Sign out failed: " + error.message);
    return;
  }

  currentUser = null;
  document.getElementById("username").value = "";
  document.getElementById("nickname").value = "";

  updateAccountDisplay();
  await refreshLikes();
  showMessage("You have signed out.");
}

// Search and category filters
function getFilteredVideos() {
  return allVideos.filter(video => {
    const matchesCategory =
      selectedCategory === "All" ||
      video.category === selectedCategory;

    const text = [
      video.title,
      video.description,
      video.creator_name,
      video.category
    ].join(" ").toLowerCase();

    const matchesSearch = text.includes(searchTerm);

    return matchesCategory && matchesSearch;
  });
}

// Get creator display name
function getCreatorName(video) {
  return video.creator_name || "JIENXS Creator";
    }
  
// ============================================
// JIENXS PART 3: VIDEO DISPLAY, LIKES & COMMENTS
// ============================================

// Create a video card
function createVideoCard(video, isShort = false) {
  const liked = userLikedVideo(video.id);
  const count = getLikeCount(video.id);

  const videoUrl = escapeHTML(video.video_url || "");
  const title = escapeHTML(video.title || "Untitled video");
  const description = escapeHTML(video.description || "");
  const creator = escapeHTML(getCreatorName(video));
  const category = escapeHTML(video.category || "Others");

  const cardClass = isShort ? "shorts-card" : "video-card";

  return `
    <article class="${cardClass}" data-video-id="${escapeHTML(video.id)}">

      <video
        src="${videoUrl}"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div class="video-details">

        <div class="video-title">${title}</div>

        <div class="video-creator">
          ${creator} · ${category}
        </div>

        <div class="video-description">${description}</div>

        <div class="video-actions">

          <button
            class="action-button ${liked ? "liked" : ""}"
            data-action="like"
            data-video-id="${escapeHTML(video.id)}"
          >
            ${liked ? "❤️ Liked" : "🤍 Like"}
          </button>

          <span class="like-count" id="like-count-${escapeHTML(video.id)}">
            ${count} likes
          </span>

          <button
            class="action-button"
            data-action="share"
            data-video-id="${escapeHTML(video.id)}"
          >
            ↗ Share
          </button>

          ${
            currentUser && video.creator_id === currentUser.id
              ? `<button
                  class="action-button"
                  data-action="delete-video"
                  data-video-id="${escapeHTML(video.id)}"
                >🗑 Delete video</button>`
              : ""
          }

        </div>

        <div class="inline-comments">

          <h4>Comments</h4>

          <div
            class="comment-list"
            id="comments-${escapeHTML(video.id)}"
          >
            <p class="muted">Loading comments...</p>
          </div>

          <form
            class="comment-form"
            data-video-id="${escapeHTML(video.id)}"
          >
            <input
              type="text"
              name="comment"
              placeholder="${currentUser ? "Write a comment..." : "Sign in to comment"}"
              maxlength="1000"
              required
            >

            <button type="submit">Send</button>
          </form>

        </div>
      </div>
    </article>
  `;
}

// Render home videos
function renderVideos() {
  const container = document.getElementById("videoGrid");
  const videos = getFilteredVideos();

  if (!videos.length) {
    container.innerHTML =
      '<div class="empty-state">No videos found. Be the first to upload!</div>';
    return;
  }

  container.innerHTML = videos.map(video =>
    createVideoCard(video)
  ).join("");

  videos.forEach(video => loadComments(video.id));
}

// Render Shorts
function renderShorts() {
  const container = document.getElementById("shortsFeed");

  if (!container) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    container.innerHTML =
      '<div class="empty-state">No Shorts available yet.</div>';
    return;
  }

  container.innerHTML = videos.map(video =>
    createVideoCard(video, true)
  ).join("");

  videos.forEach(video => loadComments(video.id));
}

// Render Explore
function renderExplore() {
  const container = document.getElementById("exploreGrid");

  if (!container) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    container.innerHTML =
      '<div class="empty-state">Nothing to explore yet.</div>';
    return;
  }

  container.innerHTML = videos.map(video =>
    createVideoCard(video)
  ).join("");

  videos.forEach(video => loadComments(video.id));
}

// ============================================
// LIKE AND UNLIKE
// ============================================

async function toggleLike(videoId) {
  if (!currentUser) {
    showMessage("Please sign in to like videos.");
    return;
  }

  const { data: existingLike, error: checkError } =
    await supabaseClient
      .from("likes")
      .select("video_id,user_id")
      .eq("video_id", videoId)
      .eq("user_id", currentUser.id)
      .maybeSingle();

  if (checkError) {
    showMessage("Could not check Like: " + checkError.message);
    return;
  }

  if (existingLike) {
    // REMOVE THE CURRENT USER'S LIKE
    const { error } = await supabaseClient
      .from("likes")
      .delete()
      .eq("video_id", videoId)
      .eq("user_id", currentUser.id);

    if (error) {
      showMessage("Could not remove Like: " + error.message);
      return;
    }

  } else {
    // ADD A NEW LIKE
    const { error } = await supabaseClient
      .from("likes")
      .insert({
        video_id: videoId,
        user_id: currentUser.id
      });

    if (error) {
      showMessage("Could not Like video: " + error.message);
      return;
    }
  }

  // Reload likes from database
  await refreshLikes();
}

// ============================================
// LOAD COMMENTS
// ============================================

async function loadComments(videoId) {
  const container = document.getElementById(
    "comments-" + videoId
  );

  if (!container) return;

  const { data, error } = await supabaseClient
    .from("comments")
    .select("*")
    .eq("video_id", videoId)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Comment loading error:", error);
    container.innerHTML =
      '<p class="muted">Could not load comments.</p>';
    return;
  }

  if (!data || !data.length) {
    container.innerHTML =
      '<p class="muted">No comments yet. Start the conversation!</p>';
    return;
  }

  container.innerHTML = data.map(comment => {
    const ownerCanDelete =
      currentUser && comment.user_id === currentUser.id;

    return `
      <div class="comment-item">

        <div class="comment-name">
          ${escapeHTML(comment.creator_name || "JIENXS User")}
        </div>

        <div class="comment-content">
          ${escapeHTML(comment.content)}
        </div>

        <div class="comment-date">
          ${formatDate(comment.created_at)}
        </div>

        ${
          ownerCanDelete
            ? `<button
                class="comment-delete"
                data-action="delete-comment"
                data-comment-id="${escapeHTML(comment.id)}"
                data-video-id="${escapeHTML(videoId)}"
              >🗑 Delete my comment</button>`
            : ""
        }

      </div>
    `;
  }).join("");
}

// ============================================
// ADD COMMENT
// ============================================

async function addComment(videoId, content) {
  if (!currentUser) {
    showMessage("Please sign in to comment.");
    return;
  }

  content = content.trim();

  if (!content) {
    showMessage("Please write a comment first.");
    return;
  }

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  const creatorName =
    profile?.nickname ||
    profile?.username ||
    currentUser.email ||
    "JIENXS User";

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      video_id: videoId,
      user_id: currentUser.id,
      creator_name: creatorName,
      content: content
    });

  if (error) {
    showMessage("Comment could not be posted: " + error.message);
    return;
  }

  await loadComments(videoId);
  showMessage("Comment posted successfully!");
}

// ============================================
// DELETE YOUR OWN COMMENT
// ============================================

async function deleteComment(commentId, videoId) {
  if (!currentUser) {
    showMessage("Please sign in first.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete your comment?"
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("comments")
    .delete()
    .eq("id", commentId)
    .eq("user_id", currentUser.id);

  if (error) {
    showMessage("Comment could not be deleted: " + error.message);
    return;
  }

  await loadComments(videoId);
  showMessage("Your comment has been deleted.");
          }
  
// ============================================
// JIENXS PART 4: UPLOAD, DELETE & SHARE VIDEOS
// ============================================

// UPLOAD A VIDEO
async function uploadVideo() {
  if (!currentUser) {
    showMessage("Please sign in before uploading.", "uploadMessage");
    return;
  }

  const title = document.getElementById("videoTitle").value.trim();
  const category = document.getElementById("videoCategory").value;
  const description = document.getElementById("videoDescription").value.trim();
  const fileInput = document.getElementById("videoFile");
  const file = fileInput.files[0];

  if (!title) {
    showMessage("Please enter a video title.", "uploadMessage");
    return;
  }

  if (!file) {
    showMessage("Please select a video file.", "uploadMessage");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage("Please select a valid video file.", "uploadMessage");
    return;
  }

  const maxSize = 100 * 1024 * 1024;

  if (file.size > maxSize) {
    showMessage("Your video is larger than 100 MB.", "uploadMessage");
    return;
  }

  const uploadButton = document.getElementById("uploadButton");
  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";

  let uploadedFilePath = null;

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    uploadedFilePath =
      currentUser.id + "/" + Date.now() + "_" + safeName;

    // Upload file to Supabase storage
    const { error: storageError } = await supabaseClient
      .storage
      .from("jienxs")
      .upload(uploadedFilePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (storageError) {
      throw storageError;
    }

    // Get public video URL
    const { data: publicData } = supabaseClient
      .storage
      .from("jienxs")
      .getPublicUrl(uploadedFilePath);

    const videoUrl = publicData.publicUrl;

    // Save video details without creator_name
    const { error: databaseError } = await supabaseClient
      .from("videos")
      .insert({
        title: title,
        description: description,
        category: category,
        video_url: videoUrl,
        creator_id: currentUser.id,
        status: "approved"
      });

    if (databaseError) {
      throw databaseError;
    }

    // Clear form
    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoFile").value = "";

    showMessage("Your video has been uploaded successfully!", "uploadMessage");

    await loadVideos();
    showPage("home");

  } catch (error) {
    console.error("Upload error:", error);

    // Remove uploaded file if database insertion failed
    if (uploadedFilePath) {
      await supabaseClient
        .storage
        .from("jienxs")
        .remove([uploadedFilePath]);
    }

    showMessage(
      "Upload failed: " + error.message,
      "uploadMessage"
    );

  } finally {
    uploadButton.disabled = false;
    uploadButton.textContent = "Upload Video";
  }
}

// ============================================
// DELETE YOUR OWN VIDEO
// ============================================

async function deleteVideo(videoId) {
  if (!currentUser) {
    showMessage("Please sign in first.");
    return;
  }

  const video = allVideos.find(item =>
    String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video could not be found.");
    return;
  }

  if (video.creator_id !== currentUser.id) {
    showMessage("You can only delete your own videos.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this video?"
  );

  if (!confirmed) return;

  try {
    // Delete video database record
    const { data: deletedVideo, error: databaseError } =
      await supabaseClient
        .from("videos")
        .delete()
        .eq("id", videoId)
        .eq("creator_id", currentUser.id)
        .select("id,video_url")
        .maybeSingle();

    if (databaseError) {
      throw databaseError;
    }

    if (!deletedVideo) {
      throw new Error(
        "Video was not deleted. Check your Supabase DELETE policy."
      );
    }

    // Extract storage path from public video URL
    const marker = "/storage/v1/object/public/jienxs/";
    const url = deletedVideo.video_url || "";
    const position = url.indexOf(marker);

    if (position !== -1) {
      const filePath = decodeURIComponent(
        url.substring(position + marker.length)
      );

      const { error: storageError } = await supabaseClient
        .storage
        .from("jienxs")
        .remove([filePath]);

      if (storageError) {
        console.error("Storage deletion error:", storageError);

        showMessage(
          "Video record deleted, but storage cleanup failed: " +
          storageError.message
        );
      }
    }

    showMessage("Your video has been deleted successfully!");

    await loadVideos();

  } catch (error) {
    console.error("Video deletion error:", error);

    showMessage(
      "Video deletion failed: " + error.message
    );
  }
}

// ============================================
// SHARE VIDEOS
// ============================================

async function shareVideo(videoId) {
  const video = allVideos.find(item =>
    String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video could not be found.");
    return;
  }

  const shareUrl =
    window.location.href.split("?")[0] +
    "?video=" + encodeURIComponent(videoId);

  const shareData = {
    title: video.title || "JIENXS Video",
    text: "Watch this video on JIENXS!",
    url: shareUrl
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);

    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(shareUrl);
      showMessage("Video link copied!");

    } else {
      window.prompt("Copy this video link:", shareUrl);
    }

  } catch (error) {
    if (error.name !== "AbortError") {
      showMessage("Sharing failed: " + error.message);
    }
  }
      }

// ============================================
// LIKE, UNLIKE, DELETE VIDEO & SHARE
// ============================================

document.addEventListener("click", async event => {
  const button = event.target.closest("[data-action]");

  if (!button) return;

  const action = button.dataset.action;
  const videoId = button.dataset.videoId;

  if (action === "like") {
    button.disabled = true;

    try {
      await toggleLike(videoId);
    } finally {
      button.disabled = false;
    }
  }

  if (action === "delete-video") {
    await deleteVideo(videoId);
  }

  if (action === "share") {
    await shareVideo(videoId);
  }

  if (action === "delete-comment") {
    const commentId = button.dataset.commentId;

    await deleteComment(commentId, videoId);
  }
});

// COMMENT SUBMISSION
// ============================================

document.addEventListener("submit", async event => {
  const form = event.target.closest(".comment-form");

  if (!form) return;

  event.preventDefault();

  const videoId = form.dataset.videoId;
  const input = form.querySelector('input[name="comment"]');
  const submitButton = form.querySelector("button");

  const content = input.value.trim();

  if (!currentUser) {
    showMessage("Please sign in to comment.");
    return;
  }

  if (!content) {
    showMessage("Please enter a comment.");
    return;
  }

  submitButton.disabled = true;

  try {
    await addComment(videoId, content);

    input.value = "";

  } finally {
    submitButton.disabled = false;
  }
});

// ============================================
// AUTHENTICATION STARTUP
// ============================================

async function initializeJIENXS() {
  if (jienxsInitialized) return;

  jienxsInitialized = true;

  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

    updateAccountDisplay();

    if (currentUser) {
      await loadProfile();
    }

    await loadVideos();

    // Open a shared video when a shared link is visited
    const params = new URLSearchParams(window.location.search);
    const sharedVideoId = params.get("video");

    if (sharedVideoId) {
      const sharedVideo = allVideos.find(
        video => String(video.id) === sharedVideoId
      );

      if (sharedVideo) {
        showPage("home");

        setTimeout(() => {
          const cards = document.querySelectorAll(
            ".video-card[data-video-id]"
          );

          cards.forEach(card => {
            if (card.dataset.videoId === sharedVideoId) {
              card.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });
            }
          });
        }, 500);
      }
    }

  } catch (error) {
    console.error("JIENXS startup error:", error);

    showMessage(
      "Website startup error: " + error.message
    );
  }
}

// ============================================
// LOGIN AND LOGOUT SESSION LISTENER
// ============================================

supabaseClient.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;

  updateAccountDisplay();

  if (currentUser) {
    setTimeout(async () => {
      await loadProfile();
      await refreshLikes();
    }, 0);

  } else {
    document.getElementById("username").value = "";
    document.getElementById("nickname").value = "";

    setTimeout(() => {
      refreshLikes();
    }, 0);
  }
});

// ============================================
// START JIENXS
// ============================================

initializeJIENXS();
