
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>JIENXS - Watch. Share. Discover.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #080808;
  --panel: #151515;
  --panel2: #202020;
  --accent: #ff3158;
  --text: #ffffff;
  --muted: #aaaaaa;
  --border: #303030;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding-bottom: 85px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  height: 62px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101010;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  color: var(--accent);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}

.header-button {
  background: var(--accent);
  color: white;
  border: 0;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin-top: 8px;
}

.muted {
  color: var(--muted);
}

.search-box {
  width: 100%;
  padding: 13px;
  border-radius: 25px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  margin: 12px 0;
  outline: none;
}

.category-list {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 8px 0 14px;
}

.category-list button {
  white-space: nowrap;
  padding: 9px 15px;
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 22px;
}

.category-list button.active,
.category-list button:focus {
  background: var(--accent);
  border-color: var(--accent);
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.video-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  min-width: 0;
  margin-bottom: 15px;
}

.video-card video {
  display: block;
  width: 100%;
  max-height: 480px;
  background: #000;
  object-fit: contain;
}

.video-details {
  padding: 12px;
}

.video-title {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 7px;
  overflow-wrap: anywhere;
}

.video-description {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.video-creator {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 9px;
}

.video-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}

.action-button {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  padding: 8px 11px;
  border-radius: 20px;
  font-size: 13px;
}

.action-button.liked {
  color: var(--accent);
  border-color: var(--accent);
}

.like-count {
  font-size: 13px;
  color: var(--muted);
}

.inline-comments {
  border-top: 1px solid var(--border);
  margin-top: 12px;
  padding-top: 12px;
}

.inline-comments h4 {
  margin: 0 0 10px;
}

.comment-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.comment-item {
  background: #202020;
  border-radius: 9px;
  padding: 10px;
  overflow-wrap: anywhere;
}

.comment-name {
  font-size: 13px;
  font-weight: bold;
}

.comment-content {
  font-size: 14px;
  margin: 6px 0;
  white-space: pre-wrap;
}

.comment-date {
  font-size: 11px;
  color: var(--muted);
}

.comment-delete {
  background: transparent;
  color: var(--accent);
  border: 0;
  padding: 5px 0;
  font-size: 12px;
}

.comment-form {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.comment-form input {
  min-width: 0;
  flex: 1;
  padding: 11px;
  background: #202020;
  color: white;
  border: 1px solid var(--border);
  border-radius: 20px;
}

.comment-form button {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 0 14px;
}

.shorts-feed {
  max-width: 480px;
  margin: auto;
}

.shorts-card {
  margin-bottom: 20px;
  background: var(--panel);
  border-radius: 13px;
  overflow: hidden;
}

.shorts-card video {
  width: 100%;
  max-height: 72vh;
  display: block;
  background: black;
  object-fit: contain;
}

.shorts-card .video-details {
  padding: 12px;
}

.explore-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.form-panel {
  background: var(--panel);
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 13px;
  margin: 15px 0;
}

.form-panel input,
.form-panel textarea,
.form-panel select {
  width: 100%;
  padding: 12px;
  margin: 7px 0 13px;
  color: white;
  background: #202020;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.form-panel textarea {
  min-height: 90px;
  resize: vertical;
}

.primary-button {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px 17px;
  font-weight: bold;
}

.secondary-button {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 15px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.message {
  display: none;
  background: #202020;
  border: 1px solid var(--accent);
  padding: 11px;
  border-radius: 8px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.message.show {
  display: block;
}

.empty-state {
  color: var(--muted);
  text-align: center;
  padding: 30px 10px;
  grid-column: 1 / -1;
}

/* FIXED BOTTOM PHONE NAVIGATION */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #111111;
  border-top: 1px solid #333333;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  height: 100%;
  background: transparent;
  color: #aaaaaa;
  border: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  font-size: 11px;
}

.nav-item .nav-icon {
  font-size: 21px;
}

.nav-item.active {
  color: var(--accent);
  font-weight: bold;
}

@media (min-width: 700px) {
  .video-grid,
  .explore-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 420px) {
  main {
    padding: 10px;
  }

  .video-grid,
  .explore-grid {
    grid-template-columns: 1fr;
  }

  .bottom-nav {
    height: 68px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JIENXS</div>
  <button class="header-button" id="authButton">Account</button>
</header>

<main>

  <div id="messageBox" class="message"></div>

  <!-- HOME -->
  <section id="home" class="page active">
    <h2>Discover videos</h2>
    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="Search videos..."
    >

    <div class="category-list">
      <button class="active" data-category="All">All</button>
      <button data-category="Football">Football</button>
      <button data-category="Sports">Sports</button>
      <button data-category="Entertainment">Entertainment</button>
      <button data-category="Music">Music</button>
      <button data-category="Others">Others</button>
    </div>

    <div id="videoGrid" class="video-grid">
      <div class="empty-state">Loading videos...</div>
    </div>
  </section>

  <!-- SHORTS -->
  <section id="shorts" class="page">
    <h2>🎬 JIENXS Shorts</h2>
    <p class="muted">Watch short videos and discover something new.</p>
    <div id="shortsFeed" class="shorts-feed">
      <div class="empty-state">Loading Shorts...</div>
    </div>
  </section>

  <!-- EXPLORE -->
  <section id="explore" class="page">
    <h2>🌍 Explore</h2>
    <p class="muted">Discover videos from across JIENXS.</p>
    <div id="exploreGrid" class="explore-grid"></div>
  </section>

  <!-- UPLOAD -->
  <section id="upload" class="page">
    <h2>⬆ Upload a video</h2>

    <div class="form-panel">
      <label for="videoTitle">Video title</label>
      <input id="videoTitle" type="text" placeholder="Enter video title">

      <label for="videoCategory">Category</label>
      <select id="videoCategory">
        <option value="Football">Football</option>
        <option value="Sports">Sports</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Music">Music</option>
        <option value="Others">Others</option>
      </select>

      <label for="videoDescription">Description</label>
      <textarea id="videoDescription" placeholder="Describe your video..."></textarea>

      <label for="videoFile">Choose video</label>
      <input id="videoFile" type="file" accept="video/*">

      <button id="uploadButton" class="primary-button">Upload Video</button>
      <p class="muted">Maximum upload size: 100 MB.</p>
      <div id="uploadMessage" class="message"></div>
    </div>
  </section>

  <!-- ACCOUNT -->
  <section id="account" class="page">
    <h2>👤 Your account</h2>

    <div class="form-panel">
      <h3>Create an account</h3>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <div class="button-row">
        <button id="createAccountButton" class="primary-button">Sign Up</button>
        <button id="signInButton" class="secondary-button">Sign In</button>
      </div>
    </div>

    <div class="form-panel">
      <h3>Your profile</h3>
      <p id="identityPreview" class="muted">Not signed in</p>
      <p id="handlePreview" class="muted"></p>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username">

      <label for="nickname">Display name</label>
      <input id="nickname" type="text" placeholder="Your display name">

      <div class="button-row">
        <button id="saveProfileButton" class="primary-button">Save Profile</button>
        <button id="signOutButton" class="secondary-button">Sign Out</button>
      </div>
    </div>
  </section>

</main>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button class="nav-item" data-page="shorts">
    <span class="nav-icon">🎬</span>
    <span>Shorts</span>
  </button>

  <button class="nav-item" data-page="explore">
    <span class="nav-icon">🌍</span>
    <span>Explore</span>
  </button>

  <button class="nav-item" data-page="upload">
    <span class="nav-icon">⬆</span>
    <span>Upload</span>
  </button>

  <button class="nav-item" data-page="account">
    <span class="nav-icon">👤</span>
    <span>Account</span>
  </button>
</nav>

<script>
        
// ==========================================
// PART 2: SUPABASE CONNECTION AND VIDEO SYSTEM
// ==========================================

// Your existing Supabase project

const SUPABASE_URL = "https://duwdfekgjcleihrimxrf.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// ==========================================
// GLOBAL WEBSITE DATA
// ==========================================

let currentUser = null;
let currentProfile = null;
let allVideos = [];
let currentCategory = "All";
let currentSearch = "";
let videoLikes = {};
let likedVideos = new Set();
let commentCache = {};


// ==========================================
// MESSAGE DISPLAY
// ==========================================

function showMessage(message) {
  const box = document.getElementById("messageBox");

  if (!box) return;

  box.textContent = message;
  box.classList.add("show");

  clearTimeout(window.jienxsMessageTimer);

  window.jienxsMessageTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 4500);
}


// ==========================================
// SAFE TEXT DISPLAY
// ==========================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}


// ==========================================
// PAGE NAVIGATION
// ==========================================

function showPage(pageId) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const selectedPage = document.getElementById(pageId);

  if (selectedPage) {
    selectedPage.classList.add("active");
  }

  document.querySelectorAll(".nav-item").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === pageId
    );
  });

  pauseAllVideos();
  window.scrollTo({ top: 0, behavior: "smooth" });
}


// ==========================================
// PAUSE VIDEOS WHEN CHANGING PAGES
// ==========================================

function pauseAllVideos() {
  document.querySelectorAll("video").forEach(video => {
    video.pause();
  });
}


// ==========================================
// CATEGORY FILTER
// ==========================================

function filterCategory(category) {
  currentCategory = category;

  document.querySelectorAll("[data-category]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === category
    );
  });

  renderVideos();
  renderShorts();
  renderExplore();
}


// ==========================================
// VIDEO SEARCH
// ==========================================

function searchVideos(event) {
  currentSearch = event.target.value.trim().toLowerCase();

  renderVideos();
  renderShorts();
  renderExplore();
}


// ==========================================
// FILTER VIDEO DATA
// ==========================================

function getFilteredVideos() {
  return allVideos.filter(video => {
    const categoryMatch =
      currentCategory === "All" ||
      video.category === currentCategory;

    const searchText = [
      video.title,
      video.description,
      video.creator_name,
      video.category
    ].join(" ").toLowerCase();

    const searchMatch =
      !currentSearch || searchText.includes(currentSearch);

    return categoryMatch && searchMatch;
  });
}


// ==========================================
// LOAD VIDEO LIKES
// ==========================================

async function loadVideoLikes() {
  videoLikes = {};
  likedVideos = new Set();

  if (!allVideos.length) return;

  const videoIds = allVideos.map(video => video.id);

  try {
    const { data, error } = await supabaseClient
      .from("likes")
      .select("video_id,user_id")
      .in("video_id", videoIds);

    if (error) throw error;

    (data || []).forEach(like => {
      videoLikes[like.video_id] =
        (videoLikes[like.video_id] || 0) + 1;

      if (
        currentUser &&
        like.user_id === currentUser.id
      ) {
        likedVideos.add(String(like.video_id));
      }
    });

  } catch (error) {
    console.error("Could not load likes:", error);
  }
}


// ==========================================
// LOAD VIDEOS FROM SUPABASE
// ==========================================

async function loadVideos() {
  const grid = document.getElementById("videoGrid");

  if (grid) {
    grid.innerHTML = '<div class="empty-state">Loading videos...</div>';
  }

  try {
    const { data, error } = await supabaseClient
      .from("videos")
      .select("*")
      .eq("status", "published")
      .order("created_at", { ascending: false });

    if (error) throw error;

    allVideos = data || [];

    await loadVideoLikes();

    renderVideos();
    renderShorts();
    renderExplore();

  } catch (error) {
    console.error("Video loading error:", error);

    if (grid) {
      grid.innerHTML =
        '<div class="empty-state">Unable to load videos. Please refresh and try again.</div>';
    }

    showMessage("Video loading error: " + error.message);
  }
}


// ==========================================
// GET CREATOR NAME
// ==========================================

function getCreatorName(video) {
  return video.creator_name || "JIENXS Creator";
}


// ==========================================
// CHECK IF VIDEO BELONGS TO CURRENT USER
// ==========================================

function isMyVideo(video) {
  return Boolean(
    currentUser &&
    video.creator_id === currentUser.id
  );
}


// ==========================================
// CREATE VIDEO CARD
// ==========================================

function createVideoCard(video) {
  const id = escapeHTML(video.id);
  const title = escapeHTML(video.title);
  const creator = escapeHTML(getCreatorName(video));
  const description = escapeHTML(video.description || "");
  const category = escapeHTML(video.category || "Others");
  const videoUrl = escapeHTML(video.video_url || "");

  const likes = videoLikes[video.id] || 0;

  const isLiked = likedVideos.has(String(video.id));

  const deleteButton = isMyVideo(video)
    ? `<button class="action-button" data-action="delete-video" data-id="${id}">🗑 Delete</button>`
    : "";

  return `
    <article class="video-card" data-video-card="${id}">

      <video
        controls
        playsinline
        preload="metadata"
        src="${videoUrl}"
        data-player="true"
      >
        Your browser does not support this video.
      </video>

      <div class="video-details">

        <div class="video-title">${title}</div>

        <div class="video-creator">
          By ${creator} · ${category}
        </div>

        <div class="video-description">${description}</div>

        <div class="video-actions">

          <button
            class="action-button ${isLiked ? "liked" : ""}"
            data-action="like"
            data-id="${id}"
          >
            ${isLiked ? "❤️ Liked" : "🤍 Like"}
          </button>

          <span class="like-count">
            <span data-like-count="${id}">${likes}</span>
            ${likes === 1 ? "like" : "likes"}
          </span>

          <button
            class="action-button"
            data-action="share"
            data-id="${id}"
          >
            ↗ Share
          </button>

          ${deleteButton}

        </div>

        <div class="inline-comments">
          <h4>💬 Comments</h4>

          <div class="comment-list" data-comments="${id}">
            Loading comments...
          </div>

          <form class="comment-form" data-comment-form="${id}">
            <input
              type="text"
              maxlength="1000"
              placeholder="Write a comment..."
              aria-label="Write a comment"
              required
            >

            <button type="submit">Post</button>
          </form>

        </div>

      </div>
    </article>
  `;
}


// ==========================================
// RENDER HOME VIDEOS
// ==========================================

function renderVideos() {
  const grid = document.getElementById("videoGrid");

  if (!grid) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    grid.innerHTML =
      '<div class="empty-state">No videos found. Try another search or category.</div>';
    return;
  }

  grid.innerHTML = videos.map(createVideoCard).join("");

  videos.forEach(video => {
    loadCommentsForVideo(video.id);
  });
}


// ==========================================
// RENDER SHORTS
// ==========================================

function renderShorts() {
  const feed = document.getElementById("shortsFeed");

  if (!feed) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    feed.innerHTML =
      '<div class="empty-state">No Shorts available yet.</div>';
    return;
  }

  feed.innerHTML = videos.map(video => {
    const id = escapeHTML(video.id);

    const likes = videoLikes[video.id] || 0;
    const isLiked = likedVideos.has(String(video.id));

    return `
      <article class="shorts-card" data-video-card="${id}">

        <video
          controls
          playsinline
          preload="metadata"
          src="${escapeHTML(video.video_url || "")}"
          data-player="true"
        >
          Your browser does not support this video.
        </video>

        <div class="video-details">

          <div class="video-title">
            ${escapeHTML(video.title)}
          </div>

          <div class="video-creator">
            By ${escapeHTML(getCreatorName(video))}
          </div>

          <div class="video-actions">

            <button
              class="action-button ${isLiked ? "liked" : ""}"
              data-action="like"
              data-id="${id}"
            >
              ${isLiked ? "❤️ Liked" : "🤍 Like"}
            </button>

            <span class="like-count">
              <span data-like-count="${id}">${likes}</span>
              ${likes === 1 ? "like" : "likes"}
            </span>

            <button
              class="action-button"
              data-action="share"
              data-id="${id}"
            >
              ↗ Share
            </button>

          </div>

          <div class="inline-comments">
            <h4>💬 Comments</h4>
            <div class="comment-list" data-comments="${id}">
              Loading comments...
            </div>

            <form class="comment-form" data-comment-form="${id}">
              <input
                type="text"
                maxlength="1000"
                placeholder="Write a comment..."
                aria-label="Write a comment"
                required
              >
              <button type="submit">Post</button>
            </form>
          </div>

        </div>
      </article>
    `;
  }).join("");

  videos.forEach(video => {
    loadCommentsForVideo(video.id);
  });
}


// ==========================================
// RENDER EXPLORE
// ==========================================

function renderExplore() {
  const grid = document.getElementById("exploreGrid");

  if (!grid) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    grid.innerHTML =
      '<div class="empty-state">Nothing to explore yet.</div>';
    return;
  }

  grid.innerHTML = videos.map(video => `
    <article class="video-card">
      <video
        controls
        playsinline
        preload="metadata"
        src="${escapeHTML(video.video_url || "")}"
      ></video>

      <div class="video-details">
        <div class="video-title">${escapeHTML(video.title)}</div>
        <div class="video-creator">
          By ${escapeHTML(getCreatorName(video))}
        </div>
        <div class="video-description">
          ${escapeHTML(video.category || "Others")}
        </div>
      </div>
    </article>
  `).join("");
}


// ==========================================
// SHARE VIDEO
// ==========================================

async function shareVideo(videoId) {
  const video = allVideos.find(
    item => String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video not found.");
    return;
  }

  const shareData = {
    title: video.title,
    text: "Watch this video on JIENXS!",
    url: video.video_url
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(video.video_url);
      showMessage("Video link copied!");
    } else {
      showMessage("Sharing is not supported by this browser.");
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      showMessage("Unable to share this video.");
    }
  }
}

// Store comment-loading requests.

const commentsLoading = new Set();


// ==========================================
// LOAD COMMENTS UNDER A VIDEO
// ==========================================

async function loadCommentsForVideo(videoId) {
  const containers = document.querySelectorAll(
    `[data-comments="${CSS.escape(String(videoId))}"]`
  );

  if (!containers.length) return;

  const cacheKey = String(videoId);

  containers.forEach(container => {
    container.innerHTML = '<p class="muted">Loading comments...</p>';
  });

  try {
    const { data: comments, error } = await supabaseClient
      .from("comments")
      .select("*")
      .eq("video_id", videoId)
      .order("created_at", { ascending: true });

    if (error) throw error;

    commentCache[cacheKey] = comments || [];

    renderComments(videoId);

  } catch (error) {
    console.error("Comment loading error:", error);

    containers.forEach(container => {
      container.innerHTML =
        '<p class="muted">Comments could not be loaded.</p>';
    });
  }
}


// ==========================================
// DISPLAY COMMENTS
// ==========================================

function renderComments(videoId) {
  const containers = document.querySelectorAll(
    `[data-comments="${CSS.escape(String(videoId))}"]`
  );

  const comments = commentCache[String(videoId)] || [];

  if (!comments.length) {
    containers.forEach(container => {
      container.innerHTML =
        '<p class="muted">No comments yet. Be the first to comment!</p>';
    });

    return;
  }

  const html = comments.map(comment => {
    const isOwner =
      currentUser &&
      String(comment.user_id) === String(currentUser.id);

    const creatorName = escapeHTML(
      comment.creator_name || "JIENXS User"
    );

    const content = escapeHTML(comment.content || "");

    const date = comment.created_at
      ? new Date(comment.created_at).toLocaleString()
      : "";

    return `
      <div class="comment-item">

        <div class="comment-name">${creatorName}</div>

        <div class="comment-content">${content}</div>

        <div class="comment-date">${escapeHTML(date)}</div>

        ${
          isOwner
            ? `<button
                class="comment-delete"
                data-action="delete-comment"
                data-id="${escapeHTML(comment.id)}"
                data-video-id="${escapeHTML(videoId)}"
              >🗑 Delete comment</button>`
            : ""
        }

      </div>
    `;
  }).join("");

  containers.forEach(container => {
    container.innerHTML = html;
  });
}

      .from("comments")
      .insert({

        user_id: currentUser.id,

      });

// ==========================================
// VALIDATE PROFILE
// ==========================================

function validateProfile() {
  const username = document
    .getElementById("username")
    .value
    .trim()
    .toLowerCase();

  const nickname = document
    .getElementById("nickname")
    .value
    .trim();

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showMessage(
      "Username must be 3–20 characters and contain only letters, numbers or underscores."
    );
    return null;
  }

  if (nickname.length < 2 || nickname.length > 40) {
    showMessage("Display name must be between 2 and 40 characters.");
    return null;
  }

  return { username, nickname };
}


// ==========================================
// SAVE PROFILE
// ==========================================

async function saveProfile() {
  if (!currentUser) {
    showMessage("Please sign in before saving your profile.");
    showPage("account");
    return;
  }

  const profile = validateProfile();

  if (!profile) return;

  const button = document.getElementById("saveProfileButton");

  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const { data: existingProfile, error: checkError } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username", profile.username)
        .neq("id", currentUser.id)
        .maybeSingle();

    if (checkError) throw checkError;

    if (existingProfile) {
      showMessage("That username is already taken.");
      return;
    }

    const { data, error } = await supabaseClient
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username: profile.username,
        nickname: profile.nickname
      }, {
        onConflict: "id"
      })
      .select()
      .single();

    if (error) throw error;

    currentProfile = data;

    updateAccountDisplay();

    showMessage("Your profile has been saved successfully!");

  } catch (error) {
    console.error("Profile saving error:", error);

    showMessage("Could not save profile: " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "Save Profile";
  }
}

// ==========================================
// UPDATE LIKE COUNTS ON THE PAGE
// ==========================================

function updateLikeDisplays(videoId) {
  const count = videoLikes[videoId] || 0;
  const liked = likedVideos.has(String(videoId));

  document.querySelectorAll(
    `[data-like-count="${CSS.escape(String(videoId))}"]`
  ).forEach(element => {
    element.textContent = count;
  });

  document.querySelectorAll(
    `[data-action="like"][data-id="${CSS.escape(String(videoId))}"]`
  ).forEach(button => {
    button.classList.toggle("liked", liked);
    button.textContent = liked ? "❤️ Liked" : "🤍 Like";
  });

  document.querySelectorAll(
    `[data-like-count="${CSS.escape(String(videoId))}"]`
  ).forEach(element => {
    const parent = element.parentElement;

    if (parent) {
      const label = count === 1 ? "like" : "likes";
      parent.innerHTML =
        `<span data-like-count="${escapeHTML(videoId)}">${count}</span> ${label}`;
    }
  });
}


// ==========================================
// LIKE OR UNLIKE A VIDEO
// ==========================================

const likesInProgress = new Set();

async function toggleLike(videoId) {
  if (!currentUser) {
    showMessage("Please sign in to like videos.");
    showPage("account");
    return;
  }

  const key = String(videoId);

  if (likesInProgress.has(key)) return;

  likesInProgress.add(key);

  try {
    const { data: existingLike, error: checkError } =
      await supabaseClient
        .from("likes")
        .select("id")
        .eq("video_id", videoId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (checkError) throw checkError;

    if (existingLike) {
      const { error } = await supabaseClient
        .from("likes")
        .delete()
        .eq("id", existingLike.id)
        .eq("user_id", currentUser.id);

      if (error) throw error;

      likedVideos.delete(key);

    } else {
      const { error } = await supabaseClient
        .from("likes")
        .insert({
          video_id: videoId,
          user_id: currentUser.id
        });

      if (error) throw error;

      likedVideos.add(key);
    }

    // Retrieve the latest total from Supabase.

    const { count, error: countError } = await supabaseClient
      .from("likes")
      .select("*", { count: "exact", head: true })
      .eq("video_id", videoId);

    if (countError) throw countError;

    videoLikes[videoId] = count || 0;

    updateLikeDisplays(videoId);

  } catch (error) {
    console.error("Like error:", error);

    showMessage("Like could not be updated: " + error.message);

    // Reload the actual likes to correct the display.

    await loadVideoLikes();
    renderVideos();
    renderShorts();

  } finally {
    likesInProgress.delete(key);
  }
}


// ==========================================
// UPLOAD A VIDEO
// ==========================================

async function uploadVideo() {
  if (!currentUser) {
    showMessage("Please sign in before uploading.");
    showPage("account");
    return;
  }

  const title = document.getElementById("videoTitle").value.trim();
  const category = document.getElementById("videoCategory").value;
  const description =
    document.getElementById("videoDescription").value.trim();

  const fileInput = document.getElementById("videoFile");
  const file = fileInput.files[0];

  if (!title) {
    showMessage("Please enter a video title.");
    return;
  }

  if (!file) {
    showMessage("Please select a video file.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage("Please select a valid video file.");
    return;
  }

  if (file.size > 100 * 1024 * 1024) {
    showMessage("Your video must be smaller than 100 MB.");
    return;
  }

  const button = document.getElementById("uploadButton");

  button.disabled = true;
  button.textContent = "Uploading...";

  let storagePath = null;
  let uploadCompleted = false;

  try {
    const safeName = file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

    storagePath =
      `${currentUser.id}/${Date.now()}-${safeName}`;

    // Upload the video to the JIENXS storage bucket.

    const { error: uploadError } =
      await supabaseClient.storage
        .from("jienxs")
        .upload(storagePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

    if (uploadError) throw uploadError;

    uploadCompleted = true;

    // Get the public video URL.

    const { data: publicData } =
      supabaseClient.storage
        .from("jienxs")
        .getPublicUrl(storagePath);

    const videoUrl = publicData.publicUrl;

    const creatorName =
      currentProfile?.nickname ||
      currentProfile?.username ||
      currentUser.email.split("@")[0];

    // Save video details in the videos table.

    const { error: insertError } = await supabaseClient
      .from("videos")
      .insert({
        title: title,
        creator_name: creatorName,
        category: category,
        description: description,
        video_url: videoUrl,
        storage_path: storagePath,
        creator_id: currentUser.id,
        status: "published"
      });

    if (insertError) throw insertError;

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    fileInput.value = "";

    showMessage("Your video has been uploaded successfully!");

    await loadVideos();

    showPage("home");

  } catch (error) {
    console.error("Video upload error:", error);

    // Remove the uploaded file if saving its database record failed.

    if (uploadCompleted && storagePath) {
      const { error: cleanupError } =
        await supabaseClient.storage
          .from("jienxs")
          .remove([storagePath]);

      if (cleanupError) {
        console.error("Upload cleanup error:", cleanupError);
      }
    }

    showMessage("Upload failed: " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "Upload Video";
  }
}


// ==========================================
// DELETE YOUR OWN VIDEO
// ==========================================

async function deleteVideo(videoId) {
  if (!currentUser) {
    showMessage("Please sign in to delete videos.");
    return;
  }

  const video = allVideos.find(
    item => String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video not found.");
    return;
  }

  if (String(video.creator_id) !== String(currentUser.id)) {
    showMessage("You can only delete your own videos.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this video?"
  );

  if (!confirmed) return;

  try {
    // Delete the video record belonging to this user.

    const { data, error } = await supabaseClient
      .from("videos")
      .delete()
      .eq("id", videoId)
      .eq("creator_id", currentUser.id)
      .select("id");

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error(
        "The video was not deleted. Check your database permissions."
      );
    }

    // Remove the file from storage.

    if (video.storage_path) {
      const { error: storageError } =
        await supabaseClient.storage
          .from("jienxs")
          .remove([video.storage_path]);

      if (storageError) {
        console.error("Storage deletion error:", storageError);
        showMessage(
          "Video record deleted, but its storage file could not be removed."
        );
      } else {
        showMessage("Video deleted successfully!");
      }
    } else {
      showMessage("Video deleted successfully!");
    }

    await loadVideos();

  } catch (error) {
    console.error("Video deletion error:", error);

    showMessage("Could not delete video: " + error.message);
  }
      }

// Connect buttons safely without duplicate listeners
function connectJienxsButton(id, callback) {
  const element = document.getElementById(id);

  if (element && !element.dataset.jienxsConnected) {
    element.addEventListener("click", callback);
    element.dataset.jienxsConnected = "true";
  }
}

// Connect all main buttons
function connectJienxsButtons() {

  // Bottom navigation
  document.querySelectorAll("[data-page]").forEach(button => {
    if (!button.dataset.jienxsConnected) {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });

      button.dataset.jienxsConnected = "true";
    }
  });

  // Header account button
  connectJienxsButton("authButton", () => {
    showPage("account");
  });

  // Upload video
  connectJienxsButton("uploadButton", uploadVideo);

  // Save profile
  connectJienxsButton("saveProfileButton", saveProfile);

  // Create account
  connectJienxsButton("createAccountButton", signUp);

  // Sign in
  connectJienxsButton("signInButton", signIn);

  // Sign out
  connectJienxsButton("signOutButton", signOut);

  // Search videos
  const searchInput = document.getElementById("searchInput");

  if (searchInput && !searchInput.dataset.jienxsConnected) {
    searchInput.addEventListener("input", event => {
      searchVideos(event.target.value);
    });

    searchInput.dataset.jienxsConnected = "true";
  }

  // Video category buttons
  document.querySelectorAll("[data-category]").forEach(button => {
    if (!button.dataset.jienxsConnected) {
      button.addEventListener("click", () => {
        filterCategory(button.dataset.category);
      });

      button.dataset.jienxsConnected = "true";
    }
  });
}

// Initialize the website
async function initializeJienxs() {
  try {
    connectJienxsButtons();

    showMessage("Loading JIENXS...", "success");

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    currentUser = data.session?.user || null;

    if (currentUser) {
      await loadMyProfile();
    } else {
      currentProfile = null;
    }

    updateAccountDisplay();

    await loadVideos();

    showPage("home");

    showMessage("JIENXS is ready!", "success");

    // Listen for sign-in and sign-out changes
    supabaseClient.auth.onAuthStateChange(
      (event, session) => {
        currentUser = session?.user || null;

        // Run after the auth callback completes
        Promise.resolve().then(async () => {
          try {
            if (currentUser) {
              await loadMyProfile();
            } else {
              currentProfile = null;
            }

            updateAccountDisplay();
            await loadVideos();

          } catch (error) {
            console.error("JIENXS account update:", error);
            showMessage(
              error.message || "Account update failed.",
              "error"
            );
          }
        });
      }
    );

  } catch (error) {
    console.error("JIENXS initialization error:", error);

    showMessage(
      "JIENXS could not finish loading: " +
      (error.message || "Please refresh the page."),
      "error"
    );
  }
}

// Start JIENXS when the page is ready
if (document.readyState === "loading") {
  document.addEventListener(
    "DOMContentLoaded",
    initializeJienxs
  );
} else {
  initializeJienxs();
}

</script>
</body>
</html>
