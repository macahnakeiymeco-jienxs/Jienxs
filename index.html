
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIENXS - Watch. Share. Discover.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #080808;
  --panel: #151515;
  --panel2: #202020;
  --red: #ed202b;
  --white: #ffffff;
  --muted: #aaaaaa;
  --border: #303030;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0 0 85px;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #090909;
  border-bottom: 1px solid var(--border);
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: var(--red);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}

#authButton {
  background: var(--red);
  border: 0;
  color: white;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin-top: 12px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  cursor: pointer;
}

.primary-button {
  background: var(--red);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px 17px;
  font-weight: bold;
}

.secondary-button {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
}

.category-list {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0 15px;
}

.category-list button {
  flex-shrink: 0;
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  padding: 9px 14px;
  border-radius: 20px;
}

.category-list button.active {
  background: var(--red);
  border-color: var(--red);
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.video-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  padding-bottom: 14px;
}

.video-player {
  display: block;
  width: 100%;
  max-height: 500px;
  background: #000;
  object-fit: contain;
}

.video-details {
  padding: 12px;
}

.video-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 7px;
  overflow-wrap: anywhere;
}

.video-meta {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 10px;
}

.video-description {
  color: #dddddd;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.video-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  padding: 0 12px 12px;
}

.video-actions button {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: white;
  padding: 9px 12px;
  border-radius: 20px;
}

.video-actions button.liked {
  color: var(--red);
  border-color: var(--red);
}

.comments-section {
  border-top: 1px solid var(--border);
  padding: 12px;
}

.comments-heading {
  font-weight: bold;
  margin-bottom: 10px;
}

.comment-item {
  background: #202020;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

.comment-author {
  font-weight: bold;
  color: var(--red);
  font-size: 13px;
  margin-bottom: 5px;
}

.comment-content {
  font-size: 14px;
  white-space: pre-wrap;
}

.comment-delete {
  background: transparent;
  border: 0;
  color: #ff7070;
  padding: 7px 0 0;
  font-size: 12px;
}

.comment-form {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-top: 12px;
}

.comment-form input {
  margin: 0;
  min-width: 0;
}

.comment-form button {
  background: var(--red);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px;
}

.form-panel {
  background: var(--panel);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 15px;
}

.form-panel h3 {
  margin-top: 0;
}

#messageBox {
  display: none;
  padding: 12px;
  margin: 12px 0;
  border-radius: 8px;
  background: #252525;
  overflow-wrap: anywhere;
}

#messageBox.show {
  display: block;
}

#messageBox.error {
  border: 1px solid #e33;
  color: #ff9999;
}

#messageBox.success {
  border: 1px solid #258b50;
  color: #8ee6a9;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 30;
  display: flex;
  justify-content: space-around;
  background: #111;
  border-top: 1px solid var(--border);
  padding: 9px 3px calc(9px + env(safe-area-inset-bottom));
}

.nav-item {
  background: transparent;
  color: #aaa;
  border: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 5px;
}

.nav-item.active {
  color: var(--red);
}

.nav-icon {
  font-size: 20px;
}

.empty-state {
  color: var(--muted);
  text-align: center;
  padding: 30px 10px;
}

.hidden {
  display: none !important;
}

@media (min-width: 650px) {
  main {
    padding: 22px;
  }

  .video-grid.explore-layout {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JIENXS</div>
  <button id="authButton">Account</button>
</header>

<main>

<div id="messageBox"></div>

<!-- HOME -->
<section id="home" class="page active">
  <h2>Discover videos</h2>

  <input
    id="searchInput"
    type="search"
    placeholder="Search videos..."
  >

  <div class="category-list">
    <button class="active" data-category="All">All</button>
    <button data-category="Football">Football</button>
    <button data-category="Sports">Sports</button>
    <button data-category="Entertainment">Entertainment</button>
    <button data-category="Music">Music</button>
    <button data-category="Others">Others</button>
  </div>

  <div id="videoGrid" class="video-grid">
    <div class="empty-state">Loading videos...</div>
  </div>
</section>

<!-- SHORTS -->
<section id="shorts" class="page">
  <h2>JIENXS Shorts</h2>
  <div id="shortsFeed" class="video-grid">
    <div class="empty-state">Loading videos...</div>
  </div>
</section>

<!-- EXPLORE -->
<section id="explore" class="page">
  <h2>Explore JIENXS</h2>

  <div class="category-list">
    <button class="active" data-category="All">All</button>
    <button data-category="Football">Football</button>
    <button data-category="Sports">Sports</button>
    <button data-category="Entertainment">Entertainment</button>
    <button data-category="Music">Music</button>
    <button data-category="Others">Others</button>
  </div>

  <div id="exploreGrid" class="video-grid explore-layout">
    <div class="empty-state">Loading videos...</div>
  </div>
</section>

<!-- UPLOAD -->
<section id="upload" class="page">
  <h2>Upload a video</h2>

  <div class="form-panel">
    <label for="videoTitle">Video title</label>
    <input id="videoTitle" type="text" placeholder="Enter video title">

    <label for="videoCategory">Choose category</label>
    <select id="videoCategory">
      <option value="Football">Football</option>
      <option value="Sports">Sports</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Music">Music</option>
      <option value="Others">Others</option>
    </select>

    <label for="videoDescription">Description</label>
    <textarea id="videoDescription" placeholder="Write a description..."></textarea>

    <label for="videoFile">Choose video file</label>
    <input id="videoFile" type="file" accept="video/*">

    <button id="uploadButton" class="primary-button">
      Upload Video
    </button>

    <p id="uploadMessage"></p>
  </div>
</section>

<!-- ACCOUNT -->
<section id="account" class="page">
  <h2>Your JIENXS Account</h2>

  <div class="form-panel">
    <h3>Sign in or create an account</h3>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button id="createAccountButton" class="primary-button">
      Create Account
    </button>

    <button id="signInButton" class="secondary-button">
      Sign In
    </button>
  </div>

  <div class="form-panel">
    <h3>Your profile</h3>

    <p id="identityPreview">Not signed in</p>
    <p id="handlePreview"></p>

    <input id="username" type="text" placeholder="Username">
    <input id="nickname" type="text" placeholder="Display name">

    <button id="saveProfileButton" class="primary-button">
      Save Profile
    </button>

    <button id="signOutButton" class="secondary-button">
      Sign Out
    </button>
  </div>
</section>

</main>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button class="nav-item" data-page="shorts">
    <span class="nav-icon">▶</span>
    <span>Shorts</span>
  </button>

  <button class="nav-item" data-page="explore">
    <span class="nav-icon">🌍</span>
    <span>Explore</span>
  </button>

  <button class="nav-item" data-page="upload">
    <span class="nav-icon">＋</span>
    <span>Upload</span>
  </button>

  <button class="nav-item" data-page="account">
    <span class="nav-icon">👤</span>
    <span>Account</span>
  </button>
</nav>

<script>
  
// ==========================================
// JIENXS PART 2 - DATABASE AND CORE FUNCTIONS
// ==========================================

// SUPABASE CONNECTION

const SUPABASE_URL =
  "https://duwdfekgjcleihrimxrf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ==========================================
// APPLICATION STATE
// ==========================================

let currentUser = null;
let allVideos = [];
let videoLikes = [];
let activeCategory = "All";
let searchTerm = "";
let currentPage = "home";
let isUploading = false;

// ==========================================
// MESSAGE DISPLAY
// ==========================================

function showMessage(message, type = "success", target = "messageBox") {
  const element = document.getElementById(target);

  if (!element) return;

  element.textContent = message;
  element.className = type === "error" ? "show error" : "show success";
}

function clearMessage(target = "messageBox") {
  const element = document.getElementById(target);

  if (!element) return;

  element.textContent = "";
  element.className = "";
}

// ==========================================
// SAFE TEXT DISPLAY
// ==========================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

// ==========================================
// DATE FORMAT
// ==========================================

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString();
}

// ==========================================
// CREATOR NAME
// ==========================================

function getCreatorName(video) {
  return video.creator_name || "JIENXS Creator";
}

// ==========================================
// PROFILE NAME
// ==========================================

async function getProfileName(user) {
  if (!user) return "JIENXS Creator";

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    console.error("Profile lookup error:", error);
  }

  return (
    data?.nickname ||
    data?.username ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "JIENXS Creator"
  );
}

// ==========================================
// PAGE NAVIGATION
// ==========================================

function showPage(pageName) {
  const validPages = [
    "home",
    "shorts",
    "explore",
    "upload",
    "account"
  ];

  if (!validPages.includes(pageName)) return;

  currentPage = pageName;

  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === pageName);
  });

  document.querySelectorAll(".nav-item").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === pageName
    );
  });

  if (pageName === "home") renderVideos();
  if (pageName === "shorts") renderShorts();
  if (pageName === "explore") renderExplore();
}

// ==========================================
// LOAD ALL VIDEOS
// ==========================================

async function loadVideos() {
  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Video loading error:", error);

    showMessage(
      "Could not load videos: " + error.message,
      "error"
    );

    return;
  }

  allVideos = data || [];

  await loadVideoLikes();

  renderVideos();
  renderShorts();
  renderExplore();
}

// ==========================================
// LOAD LIKES
// ==========================================

async function loadVideoLikes() {
  videoLikes = [];

  const videoIds = allVideos
    .map(video => video.id)
    .filter(Boolean);

  if (videoIds.length === 0) return;

  const { data, error } = await supabaseClient
    .from("likes")
    .select("video_id,user_id")
    .in("video_id", videoIds);

  if (error) {
    console.error("Like loading error:", error);
    return;
  }

  videoLikes = data || [];
}

// ==========================================
// COUNT LIKES
// ==========================================

function getLikeCount(videoId) {
  return videoLikes.filter(
    like => String(like.video_id) === String(videoId)
  ).length;
}

// ==========================================
// CHECK USER LIKE
// ==========================================

function userLikedVideo(videoId) {
  if (!currentUser) return false;

  return videoLikes.some(like =>
    String(like.video_id) === String(videoId) &&
    like.user_id === currentUser.id
  );
}

// ==========================================
// REFRESH LIKE DATA
// ==========================================

async function refreshLikes() {
  await loadVideoLikes();

  renderVideos();
  renderShorts();
  renderExplore();
}

// ==========================================
// LOAD USER PROFILE
// ==========================================

async function loadProfile() {
  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile loading error:", error);
    return;
  }

  if (data) {
    document.getElementById("username").value =
      data.username || "";

    document.getElementById("nickname").value =
      data.nickname || "";
  }
}

// ==========================================
// SAVE PROFILE FUNCTION
// ==========================================

async function saveProfile() {
  if (!currentUser) {
    showMessage("Please sign in first.", "error");
    return;
  }

  const username = document
    .getElementById("username").value.trim();

  const nickname = document
    .getElementById("nickname").value.trim();

  if (!username) {
    showMessage("Enter a username.", "error");
    return;
  }

  const { error } = await supabaseClient
    .from("profiles")
    .upsert({
      id: currentUser.id,
      username,
      nickname
    }, {
      onConflict: "id"
    });

  if (error) {
    showMessage(
      "Profile saving failed: " + error.message,
      "error"
    );
    return;
  }

  updateAccountDisplay();

  showMessage("Profile saved successfully.");
}

// ==========================================
// ACCOUNT DISPLAY
// ==========================================

async function updateAccountDisplay() {
  const identity = document.getElementById("identityPreview");
  const handle = document.getElementById("handlePreview");
  const authButton = document.getElementById("authButton");

  if (!currentUser) {
    identity.textContent = "Not signed in";
    handle.textContent = "";
    authButton.textContent = "Account";
    return;
  }

  const displayName = await getProfileName(currentUser);

  identity.textContent = displayName;
  handle.textContent = currentUser.email || "";
  authButton.textContent = "My Account";
}

// ==========================================
// FILTER VIDEOS BY CATEGORY AND SEARCH
// ==========================================

function getFilteredVideos() {
  return allVideos.filter(video => {
    const matchesCategory =
      activeCategory === "All" ||
      video.category === activeCategory;

    const searchableText = [
      video.title,
      video.description,
      video.creator_name,
      video.category
    ].join(" ").toLowerCase();

    const matchesSearch =
      !searchTerm || searchableText.includes(searchTerm);

    return matchesCategory && matchesSearch;
  });
}

// ==========================================
// AUTHENTICATION FUNCTIONS
// ==========================================

async function createAccount() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.", "error");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.", "error");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });

  if (error) {
    showMessage("Account creation failed: " + error.message, "error");
    return;
  }

  if (data.session) {
    currentUser = data.session.user;
    await loadProfile();
    await updateAccountDisplay();
    await loadVideos();
  }

  showMessage(
    data.session
      ? "Your JIENXS account has been created."
      : "Check your email to confirm your account.",
    "success"
  );
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.", "error");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage("Sign-in failed: " + error.message, "error");
    return;
  }

  showMessage("Signed in successfully.");
}

async function signOut() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    showMessage("Sign-out failed: " + error.message, "error");
    return;
  }

  currentUser = null;
  videoLikes = [];

  await updateAccountDisplay();
  await loadVideos();

  showMessage("You have signed out.");
  }
  
// ==========================================
// JIENXS PART 3 - VIDEOS, LIKES AND COMMENTS
// ==========================================

// ==========================================
// CREATE VIDEO CARD
// ==========================================

function createVideoCard(video) {
  const videoId = String(video.id);
  const liked = userLikedVideo(videoId);
  const likeCount = getLikeCount(videoId);

  const creatorName = getCreatorName(video);

  const isOwner =
    currentUser &&
    currentUser.id === video.creator_id;

  return `
    <article class="video-card" data-video-card="${escapeHTML(videoId)}">

      <video
        class="video-player"
        controls
        playsinline
        preload="metadata"
        src="${escapeHTML(video.video_url)}"
      >
        Your browser does not support video playback.
      </video>

      <div class="video-details">

        <div class="video-title">
          ${escapeHTML(video.title)}
        </div>

        <div class="video-meta">
          By ${escapeHTML(creatorName)}
          · ${escapeHTML(video.category || "Others")}
          · ${escapeHTML(formatDate(video.created_at))}
        </div>

        <div class="video-description">
          ${escapeHTML(video.description || "")}
        </div>

      </div>

      <div class="video-actions">

        <button
          type="button"
          class="${liked ? "liked" : ""}"
          data-action="like"
          data-video-id="${escapeHTML(videoId)}"
        >
          ${liked ? "♥" : "♡"} Like (${likeCount})
        </button>

        <button
          type="button"
          data-action="share"
          data-video-id="${escapeHTML(videoId)}"
        >
          ↗ Share
        </button>

        ${
          isOwner
            ? `
              <button
                type="button"
                data-action="delete-video"
                data-video-id="${escapeHTML(videoId)}"
              >
                Delete video
              </button>
            `
            : ""
        }

      </div>

      <div class="comments-section">

        <div class="comments-heading">
          Comments
        </div>

        <div
          class="comments-list"
          data-comments-for="${escapeHTML(videoId)}"
        >
          <div class="empty-state">Loading comments...</div>
        </div>

        <form
          class="comment-form"
          data-comment-form
          data-video-id="${escapeHTML(videoId)}"
        >

          <input
            type="text"
            name="comment"
            placeholder="${currentUser ? "Write a comment..." : "Sign in to comment"}"
            maxlength="1000"
            ${currentUser ? "" : "disabled"}
            required
          >

          <button
            type="submit"
            ${currentUser ? "" : "disabled"}
          >
            Send
          </button>

        </form>

      </div>

    </article>
  `;
}

// ==========================================
// RENDER HOME VIDEOS
// ==========================================

function renderVideos() {
  const container = document.getElementById("videoGrid");

  if (!container) return;

  const videos = getFilteredVideos();

  if (videos.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        No videos found in this category.
      </div>
    `;
    return;
  }

  container.innerHTML = videos
    .map(video => createVideoCard(video))
    .join("");

  videos.forEach(video => loadComments(video.id));
}

// ==========================================
// RENDER SHORTS
// ==========================================

function renderShorts() {
  const container = document.getElementById("shortsFeed");

  if (!container) return;

  if (allVideos.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        No videos available yet.
      </div>
    `;
    return;
  }

  container.innerHTML = allVideos
    .map(video => createVideoCard(video))
    .join("");

  allVideos.forEach(video => loadComments(video.id));
}

// ==========================================
// RENDER EXPLORE
// ==========================================

function renderExplore() {
  const container = document.getElementById("exploreGrid");

  if (!container) return;

  const videos = getFilteredVideos();

  if (videos.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        No videos to explore yet.
      </div>
    `;
    return;
  }

  container.innerHTML = videos
    .map(video => createVideoCard(video))
    .join("");

  videos.forEach(video => loadComments(video.id));
}

// ==========================================
// LOAD COMMENTS FOR ONE VIDEO
// ==========================================

async function loadComments(videoId) {
  const { data, error } = await supabaseClient
    .from("comments")
    .select("id,video_id,user_id,creator_name,content,created_at")
    .eq("video_id", videoId)
    .order("created_at", { ascending: true });

  const containers = document.querySelectorAll(
    `[data-comments-for="${CSS.escape(String(videoId))}"]`
  );

  if (error) {
    console.error("Comment loading error:", error);

    containers.forEach(container => {
      container.innerHTML = `
        <div class="empty-state">
          Could not load comments.
        </div>
      `;
    });

    return;
  }

  containers.forEach(container => {
    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          No comments yet. Be the first to comment!
        </div>
      `;
      return;
    }

    container.innerHTML = data.map(comment => {
      const canDelete =
        currentUser &&
        currentUser.id === comment.user_id;

      return `
        <div class="comment-item">

          <div class="comment-author">
            ${escapeHTML(comment.creator_name || "JIENXS User")}
          </div>

          <div class="comment-content">
            ${escapeHTML(comment.content)}
          </div>

          ${
            canDelete
              ? `
                <button
                  type="button"
                  class="comment-delete"
                  data-action="delete-comment"
                  data-comment-id="${escapeHTML(comment.id)}"
                >
                  Delete comment
                </button>
              `
              : ""
          }

        </div>
      `;
    }).join("");
  });
}

// ==========================================
// SEND COMMENT
// ==========================================

async function addComment(videoId, content) {
  if (!currentUser) {
    showMessage("Please sign in before commenting.", "error");
    return false;
  }

  const cleanContent = String(content || "").trim();

  if (!cleanContent) {
    showMessage("Please write a comment first.", "error");
    return false;
  }

  if (cleanContent.length > 1000) {
    showMessage("Comments cannot exceed 1000 characters.", "error");
    return false;
  }

  const creatorName = await getProfileName(currentUser);

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      video_id: videoId,
      user_id: currentUser.id,
      creator_name: creatorName,
      content: cleanContent
    });

  if (error) {
    console.error("Comment submission error:", error);

    showMessage(
      "Comment failed: " + error.message,
      "error"
    );

    return false;
  }

  await loadComments(videoId);

  showMessage("Comment posted successfully.");

  return true;
}

// ==========================================
// DELETE YOUR OWN COMMENT
// ==========================================

async function deleteComment(commentId) {
  if (!currentUser) {
    showMessage("Please sign in first.", "error");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this comment?"
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("comments")
    .delete()
    .eq("id", commentId)
    .eq("user_id", currentUser.id);

  if (error) {
    console.error("Comment deletion error:", error);

    showMessage(
      "Could not delete comment: " + error.message,
      "error"
    );

    return;
  }

  showMessage("Comment deleted successfully.");

  // Reload comments in all displayed copies of the video.
  const commentContainers = document.querySelectorAll(
    ".comments-list"
  );

  for (const container of commentContainers) {
    const videoCard = container.closest("[data-video-card]");

    if (videoCard) {
      await loadComments(videoCard.dataset.videoCard);
    }
  }
}

// ==========================================
// LIKE OR REMOVE LIKE
// ==========================================

async function toggleLike(videoId) {
  if (!currentUser) {
    showMessage("Please sign in before liking videos.", "error");
    return;
  }

  const existingLike = videoLikes.find(like =>
    String(like.video_id) === String(videoId) &&
    like.user_id === currentUser.id
  );

  if (existingLike) {
    // REMOVE EXISTING LIKE.
    const { error } = await supabaseClient
      .from("likes")
      .delete()
      .eq("video_id", videoId)
      .eq("user_id", currentUser.id);

    if (error) {
      console.error("Remove like error:", error);

      showMessage(
        "Could not remove like: " + error.message,
        "error"
      );

      return;
    }

    videoLikes = videoLikes.filter(like =>
      !(
        String(like.video_id) === String(videoId) &&
        like.user_id === currentUser.id
      )
    );

    showMessage("Like removed.");

  } else {
    // ADD NEW LIKE.
    const { data, error } = await supabaseClient
      .from("likes")
      .insert({
        video_id: videoId,
        user_id: currentUser.id
      })
      .select("video_id,user_id")
      .single();

    if (error) {
      console.error("Add like error:", error);

      showMessage(
        "Could not like video: " + error.message,
        "error"
      );

      return;
    }

    videoLikes.push(data);

    showMessage("Video liked.");
  }

  // Update the visible like buttons without reloading video players.
  document.querySelectorAll(
    `[data-action="like"][data-video-id="${CSS.escape(String(videoId))}"]`
  ).forEach(button => {
    const liked = userLikedVideo(videoId);
    const count = getLikeCount(videoId);

    button.classList.toggle("liked", liked);

    button.textContent =
      `${liked ? "♥" : "♡"} Like (${count})`;
  });
  }

// ==========================================
// GET THE CURRENT CREATOR NAME
// ==========================================

async function getCurrentCreatorName() {
  if (!currentUser) {
    return "JIENXS Creator";
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Creator profile error:", error);
  }

  return (
    data?.nickname ||
    data?.username ||
    currentUser.user_metadata?.username ||
    currentUser.user_metadata?.full_name ||
    currentUser.email?.split("@")[0] ||
    "JIENXS Creator"
  );
}

// ==========================================
// VIDEO UPLOAD
// ==========================================

async function uploadVideo() {
  if (isUploading) return;

  if (!currentUser) {
    showMessage(
      "Please sign in before uploading a video.",
      "error",
      "uploadMessage"
    );
    return;
  }

  const title = document
    .getElementById("videoTitle")
    .value.trim();

  const category = document
    .getElementById("videoCategory")
    .value;

  const description = document
    .getElementById("videoDescription")
    .value.trim();

  const fileInput = document.getElementById("videoFile");
  const file = fileInput.files[0];

  if (!title) {
    showMessage(
      "Please enter a video title.",
      "error",
      "uploadMessage"
    );
    return;
  }

  if (!file) {
    showMessage(
      "Please select a video file.",
      "error",
      "uploadMessage"
    );
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage(
      "Please select a valid video file.",
      "error",
      "uploadMessage"
    );
    return;
  }

  const maximumSize = 100 * 1024 * 1024;

  if (file.size > maximumSize) {
    showMessage(
      "The video is too large. Maximum size is 100 MB.",
      "error",
      "uploadMessage"
    );
    return;
  }

  isUploading = true;

  const uploadButton = document.getElementById("uploadButton");

  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";

  let uploadedFilePath = null;

  try {
    showMessage(
      "Preparing your video...",
      "success",
      "uploadMessage"
    );

    const creatorName = await getCurrentCreatorName();

    // Generate a safe unique file name.
    const extension = file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "mp4";

    const safeExtension = /^[a-z0-9]{1,10}$/.test(extension)
      ? extension
      : "mp4";

    const safeFileName =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      "." +
      safeExtension;

    // Keep uploaded files inside the creator's folder.
    const filePath =
      currentUser.id + "/" + safeFileName;

    // Upload to the JIENXS public storage bucket.
    const { data: storageData, error: storageError } =
      await supabaseClient.storage
        .from("jienxs")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

    if (storageError) {
      throw storageError;
    }

    uploadedFilePath = storageData.path;

    // Obtain the public video URL.
    const { data: publicData } =
      supabaseClient.storage
        .from("jienxs")
        .getPublicUrl(uploadedFilePath);

    const videoUrl = publicData?.publicUrl;

    if (!videoUrl) {
      throw new Error("Could not create the video URL.");
    }

    showMessage(
      "Video uploaded. Saving video details...",
      "success",
      "uploadMessage"
    );

    // Save video information, including creator_name
    // and the exact category selected by the uploader.
    const { error: databaseError } =
      await supabaseClient
        .from("videos")
        .insert({
          title: title,
          description: description,
          category: category,
          video_url: videoUrl,
          creator_id: currentUser.id,
          creator_name: creatorName,
          status: "approved"
        });

    if (databaseError) {
      throw databaseError;
    }

    // Clear the form after a successful upload.
    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoFile").value = "";

    showMessage(
      "Your video has been uploaded successfully!",
      "success",
      "uploadMessage"
    );

    // Reload videos from Supabase.
    await loadVideos();

    // Return to Home to see the uploaded video.
    showPage("home");

  } catch (error) {
    console.error("JIENXS upload error:", error);

    // Clean up the storage file if the database insert fails.
    if (uploadedFilePath) {
      const { error: cleanupError } =
        await supabaseClient.storage
          .from("jienxs")
          .remove([uploadedFilePath]);

      if (cleanupError) {
        console.error(
          "Uploaded file cleanup failed:",
          cleanupError
        );
      }
    }

    showMessage(
      "Upload failed: " +
      (error.message || "Unknown error"),
      "error",
      "uploadMessage"
    );

  } finally {
    isUploading = false;
    uploadButton.disabled = false;
    uploadButton.textContent = "Upload Video";
  }
}

// ==========================================
// DELETE YOUR OWN VIDEO
// ==========================================

async function deleteVideo(videoId) {
  if (!currentUser) {
    showMessage("Please sign in first.", "error");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this video?"
  );

  if (!confirmed) return;

  // Find a video owned by the signed-in user.
  const { data: video, error: findError } =
    await supabaseClient
      .from("videos")
      .select("id,video_url,creator_id")
      .eq("id", videoId)
      .eq("creator_id", currentUser.id)
      .maybeSingle();

  if (findError) {
    showMessage(
      "Could not find video: " + findError.message,
      "error"
    );
    return;
  }

  if (!video) {
    showMessage(
      "You cannot delete this video.",
      "error"
    );
    return;
  }

  // Delete the database record.
  const { error: deleteError } =
    await supabaseClient
      .from("videos")
      .delete()
      .eq("id", videoId)
      .eq("creator_id", currentUser.id);

  if (deleteError) {
    showMessage(
      "Video deletion failed: " + deleteError.message,
      "error"
    );
    return;
  }

  // Find and remove the associated storage file.
  const storageMarker =
    "/storage/v1/object/public/jienxs/";

  const markerPosition =
    video.video_url.indexOf(storageMarker);

  if (markerPosition !== -1) {
    const encodedPath =
      video.video_url.substring(
        markerPosition + storageMarker.length
      );

    const storagePath = decodeURIComponent(encodedPath);

    const { error: storageError } =
      await supabaseClient.storage
        .from("jienxs")
        .remove([storagePath]);

    if (storageError) {
      console.error(
        "Storage deletion error:",
        storageError
      );
    }
  }

  showMessage("Video deleted successfully.");

  await loadVideos();
}

// ==========================================
// SHARE VIDEO
// ==========================================

async function shareVideo(videoId) {
  const video = allVideos.find(
    item => String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video not found.", "error");
    return;
  }

  const shareData = {
    title: video.title || "JIENXS Video",
    text: "Watch this video on JIENXS!",
    url: video.video_url
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);

    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(video.video_url);

      showMessage(
        "Video link copied successfully.",
        "success"
      );

    } else {
      showMessage(
        "Sharing is not supported by this browser.",
        "error"
      );
    }

  } catch (error) {
    if (error.name !== "AbortError") {
      console.error("Video sharing error:", error);

      showMessage(
        "Could not share this video.",
        "error"
      );
    }
  }
  }

// ==========================================
// LIKE, UNLIKE, SHARE AND DELETE BUTTONS
// ==========================================

document.addEventListener("click", async event => {
  const button = event.target.closest("[data-action]");

  if (!button) return;

  const action = button.dataset.action;
  const videoId = button.dataset.videoId;

  if (action === "like" && videoId) {
    button.disabled = true;

    try {
      await toggleLike(videoId);
    } finally {
      button.disabled = false;
    }

    return;
  }

  if (action === "share" && videoId) {
    await shareVideo(videoId);
    return;
  }

  if (action === "delete-video" && videoId) {
    await deleteVideo(videoId);
    return;
  }

  if (action === "delete-comment") {
    const commentId = button.dataset.commentId;

    if (commentId) {
      await deleteComment(commentId);
    }
  }
});

// ==========================================
// COMMENT SUBMISSION
// ==========================================

document.addEventListener("submit", async event => {
  const form = event.target.closest("[data-comment-form]");

  if (!form) return;

  event.preventDefault();

  if (!currentUser) {
    showMessage("Please sign in before commenting.", "error");
    return;
  }

  const videoId = form.dataset.videoId;

  const input = form.querySelector(
    'input[name="comment"]'
  );

  if (!videoId || !input) return;

  const content = input.value.trim();

  if (!content) {
    showMessage("Please write a comment first.", "error");
    return;
  }

  const submitButton = form.querySelector(
    'button[type="submit"]'
  );

  submitButton.disabled = true;

  try {
    const success = await addComment(videoId, content);

    if (success) {
      input.value = "";
    }

  } finally {
    submitButton.disabled = false;
  }
});

// ==========================================
// AUTHENTICATION STATE CHANGES
// ==========================================

let authChangeRunning = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  // Avoid running multiple authentication refreshes at once.
  if (authChangeRunning) return;

  authChangeRunning = true;

  setTimeout(async () => {
    try {
      currentUser = session?.user || null;

      if (currentUser) {
        await loadProfile();
      } else {
        document.getElementById("username").value = "";
        document.getElementById("nickname").value = "";
        videoLikes = [];
      }

      await updateAccountDisplay();

      await loadVideos();

    } catch (error) {
      console.error("Authentication update error:", error);
    } finally {
      authChangeRunning = false;
    }
  }, 0);
});

// ==========================================
// INITIALIZE JIENXS
// ==========================================

async function startJIENXS() {
  try {
    showMessage("Loading JIENXS...", "success");

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

    if (currentUser) {
      await loadProfile();
    }

    await updateAccountDisplay();

    await loadVideos();

    clearMessage();

    // Open a shared video if its ID is in the URL.
    const requestedVideo =
      new URLSearchParams(window.location.search).get("video");

    if (requestedVideo) {
      showPage("home");

      setTimeout(() => {
        const card = Array.from(
          document.querySelectorAll("[data-video-card]")
        ).find(item =>
          item.dataset.videoCard === requestedVideo
        );

        if (card) {
          card.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });
        }
      }, 500);
    }

  } catch (error) {
    console.error("JIENXS startup error:", error);

    showMessage(
      "JIENXS could not load: " + error.message,
      "error"
    );
  }
}

// START WEBSITE

startJIENXS();
