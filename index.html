
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>JIENXS - Watch. Share. Discover.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#080808;
  --panel:#151515;
  --panel2:#202020;
  --accent:#ff3158;
  --text:#fff;
  --muted:#aaa;
  --border:#303030;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;padding-bottom:85px
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  height:62px;padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;background:#101010;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20
}
.logo{color:var(--accent);font-size:25px;font-weight:900;letter-spacing:1px}
.header-button{
  background:var(--accent);color:#fff;border:0;
  padding:9px 14px;border-radius:20px;font-weight:bold
}
main{width:100%;max-width:850px;margin:auto;padding:15px}
.page{display:none}
.page.active{display:block}
h2{margin-top:8px}
.muted{color:var(--muted)}
.search-box{
  width:100%;padding:13px;border-radius:25px;
  border:1px solid var(--border);background:var(--panel);
  color:#fff;margin:12px 0;outline:none
}
.category-list{
  display:flex;gap:9px;overflow-x:auto;padding:8px 0 14px
}
.category-list button{
  white-space:nowrap;padding:9px 15px;background:var(--panel2);
  color:#fff;border:1px solid var(--border);border-radius:22px
}
.category-list button.active,.category-list button:focus{
  background:var(--accent);border-color:var(--accent)
}
.video-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px
}
.video-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:13px;overflow:hidden;min-width:0;margin-bottom:15px
}
.video-card video{
  display:block;width:100%;max-height:480px;
  background:#000;object-fit:contain
}
.video-details{padding:12px}
.video-title{
  font-weight:bold;font-size:15px;margin-bottom:7px;overflow-wrap:anywhere
}
.video-description{
  color:var(--muted);font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap
}
.video-creator{color:var(--muted);font-size:12px;margin-bottom:9px}
.video-actions{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px
}
.action-button{
  background:var(--panel2);color:#fff;border:1px solid var(--border);
  padding:8px 11px;border-radius:20px;font-size:13px
}
.action-button.liked{color:var(--accent);border-color:var(--accent)}
.like-count{font-size:13px;color:var(--muted)}
.inline-comments{
  border-top:1px solid var(--border);margin-top:12px;padding-top:12px
}
.inline-comments h4{margin:0 0 10px}
.comment-list{display:flex;flex-direction:column;gap:9px}
.comment-item{
  background:#202020;border-radius:9px;padding:10px;overflow-wrap:anywhere
}
.comment-name{font-size:13px;font-weight:bold}
.comment-content{font-size:14px;margin:6px 0;white-space:pre-wrap}
.comment-date{font-size:11px;color:var(--muted)}
.comment-delete{
  background:transparent;color:var(--accent);border:0;padding:5px 0;font-size:12px
}
.comment-form{display:flex;gap:7px;margin-top:10px}
.comment-form input{
  min-width:0;flex:1;padding:11px;background:#202020;color:#fff;
  border:1px solid var(--border);border-radius:20px
}
.comment-form button{
  background:var(--accent);color:#fff;border:0;border-radius:20px;padding:0 14px
}
.shorts-feed{max-width:480px;margin:auto}
.shorts-card{
  margin-bottom:20px;background:var(--panel);border-radius:13px;overflow:hidden
}
.shorts-card video{
  width:100%;max-height:72vh;display:block;background:#000;object-fit:contain
}
.shorts-card .video-details{padding:12px}
.explore-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.form-panel{
  background:var(--panel);padding:16px;border:1px solid var(--border);
  border-radius:13px;margin:15px 0
}
.form-panel input,.form-panel textarea,.form-panel select{
  width:100%;padding:12px;margin:7px 0 13px;color:#fff;
  background:#202020;border:1px solid var(--border);border-radius:8px
}
.form-panel textarea{min-height:90px;resize:vertical}
.primary-button{
  background:var(--accent);color:#fff;border:0;
  border-radius:8px;padding:12px 17px;font-weight:bold
}
.secondary-button{
  background:var(--panel2);color:#fff;border:1px solid var(--border);
  border-radius:8px;padding:11px 15px
}
.button-row{display:flex;flex-wrap:wrap;gap:9px}
.message{
  display:none;background:#202020;border:1px solid var(--accent);
  padding:11px;border-radius:8px;margin:12px 0;overflow-wrap:anywhere
}
.message.show{display:block}
.empty-state{
  color:var(--muted);text-align:center;padding:30px 10px;grid-column:1/-1
}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;height:70px;
  display:flex;justify-content:space-around;align-items:center;
  background:#111;border-top:1px solid #333;
  padding-bottom:env(safe-area-inset-bottom)
}
.nav-item{
  flex:1;height:100%;background:transparent;color:#aaa;border:0;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:4px;font-size:11px
}
.nav-item .nav-icon{font-size:21px}
.nav-item.active{color:var(--accent);font-weight:bold}
@media(min-width:700px){
  .video-grid,.explore-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:420px){
  main{padding:10px}
  .video-grid,.explore-grid{grid-template-columns:1fr}
  .bottom-nav{height:68px}
}
</style>
</head>

<body>
<header>
  <div class="logo">JIENXS</div>
  <button class="header-button" id="authButton">Account</button>
</header>

<main>
  <div id="messageBox" class="message"></div>

  <section id="home" class="page active">
    <h2>Discover videos</h2>
    <input id="searchInput" class="search-box" type="search" placeholder="Search videos...">
    <div class="category-list">
      <button class="active" data-category="All">All</button>
      <button data-category="Football">Football</button>
      <button data-category="Sports">Sports</button>
      <button data-category="Entertainment">Entertainment</button>
      <button data-category="Music">Music</button>
      <button data-category="Others">Others</button>
    </div>
    <div id="videoGrid" class="video-grid">
      <div class="empty-state">Loading videos...</div>
    </div>
  </section>

  <section id="shorts" class="page">
    <h2>🎬 JIENXS Shorts</h2>
    <p class="muted">Watch short videos and discover something new.</p>
    <div id="shortsFeed" class="shorts-feed">
      <div class="empty-state">Loading Shorts...</div>
    </div>
  </section>

  <section id="explore" class="page">
    <h2>🌍 Explore</h2>
    <p class="muted">Discover videos from across JIENXS.</p>
    <div id="exploreGrid" class="explore-grid"></div>
  </section>

  <section id="upload" class="page">
    <h2>⬆ Upload a video</h2>
    <div class="form-panel">
      <label for="videoTitle">Video title</label>
      <input id="videoTitle" type="text" placeholder="Enter video title">

      <label for="videoCategory">Category</label>
      <select id="videoCategory">
        <option value="Football">Football</option>
        <option value="Sports">Sports</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Music">Music</option>
        <option value="Others">Others</option>
      </select>

      <label for="videoDescription">Description</label>
      <textarea id="videoDescription" placeholder="Describe your video..."></textarea>

      <label for="videoFile">Choose video</label>
      <input id="videoFile" type="file" accept="video/*">

      <button id="uploadButton" class="primary-button">Upload Video</button>
      <p class="muted">Maximum upload size: 100 MB.</p>
      <div id="uploadMessage" class="message"></div>
    </div>
  </section>

  <section id="account" class="page">
    <h2>👤 Your account</h2>
    <div class="form-panel">
      <h3>Create an account</h3>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <div class="button-row">
        <button id="createAccountButton" class="primary-button">Sign Up</button>
        <button id="signInButton" class="secondary-button">Sign In</button>
      </div>
    </div>

    <div class="form-panel">
      <h3>Your profile</h3>
      <p id="identityPreview" class="muted">Not signed in</p>
      <p id="handlePreview" class="muted"></p>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username">
      <label for="nickname">Display name</label>
      <input id="nickname" type="text" placeholder="Your display name">
      <div class="button-row">
        <button id="saveProfileButton" class="primary-button">Save Profile</button>
        <button id="signOutButton" class="secondary-button">Sign Out</button>
      </div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon">⌂</span><span>Home</span>
  </button>
  <button class="nav-item" data-page="shorts">
    <span class="nav-icon">🎬</span><span>Shorts</span>
  </button>
  <button class="nav-item" data-page="explore">
    <span class="nav-icon">🌍</span><span>Explore</span>
  </button>
  <button class="nav-item" data-page="upload">
    <span class="nav-icon">⬆</span><span>Upload</span>
  </button>
  <button class="nav-item" data-page="account">
    <span class="nav-icon">👤</span><span>Account</span>
  </button>
</nav>

<script>
  
// ==========================================
// JIENXS PART 2 - DATABASE AND ACCOUNTS
// ==========================================

const SUPABASE_URL = "https://duwdfekgjcleihrimxrf.supabase.co";

const SUPABASE_KEY = "sb_publishable_-iWmT491ZYoFQ7hJQZTwYQ_atpbcnhN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let allVideos = [];
let videoLikes = [];
let activeCategory = "All";
let searchTerm = "";
let currentPage = "home";
let isUploading = false;

// ==========================================
// GENERAL HELPERS
// ==========================================

function showMessage(message, type = "info", target = "messageBox") {
  const box = document.getElementById(target);
  if (!box) return;

  box.textContent = message;
  box.className = "message show";

  if (type === "error") {
    box.style.borderColor = "#ff3158";
  } else {
    box.style.borderColor = "#35bd75";
  }
}

function clearMessage(target = "messageBox") {
  const box = document.getElementById(target);
  if (!box) return;

  box.textContent = "";
  box.className = "message";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString();
}

function getCreatorName(video) {
  return video.creator_name || "JIENXS Creator";
}

function getProfileName(profile) {
  if (!profile) return "";

  return profile.nickname || profile.username || "";
}

// ==========================================
// PAGE NAVIGATION
// ==========================================

function showPage(page) {
  const validPages = [
    "home",
    "shorts",
    "explore",
    "upload",
    "account"
  ];

  if (!validPages.includes(page)) return;

  currentPage = page;

  document.querySelectorAll(".page").forEach(section => {
    section.classList.toggle("active", section.id === page);
  });

  document.querySelectorAll(".nav-item").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  if (page === "home") renderVideos();
  if (page === "shorts") renderShorts();
  if (page === "explore") renderExplore();
}

// ==========================================
// LOAD VIDEOS
// ==========================================

async function loadVideos() {
  const grid = document.getElementById("videoGrid");

  if (grid) {
    grid.innerHTML = '<div class="empty-state">Loading videos...</div>';
  }

  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Video loading error:", error);

    if (grid) {
      grid.innerHTML =
        '<div class="empty-state">Could not load videos. Please refresh and try again.</div>';
    }

    showMessage("Could not load videos: " + error.message, "error");
    return;
  }

  // Do not hide videos merely because their status is not "approved".
  // Public visibility is controlled by the Supabase database policies.
  allVideos = data || [];

  await loadVideoLikes();

  renderVideos();
  renderShorts();
  renderExplore();
}

// ==========================================
// LOAD LIKES
// ==========================================

async function loadVideoLikes() {
  videoLikes = [];

  if (!allVideos.length) return;

  const videoIds = allVideos.map(video => video.id);

  const { data, error } = await supabaseClient
    .from("likes")
    .select("video_id,user_id")
    .in("video_id", videoIds);

  if (error) {
    console.error("Likes loading error:", error);
    return;
  }

  videoLikes = data || [];
}

function getLikeCount(videoId) {
  return videoLikes.filter(
    like => String(like.video_id) === String(videoId)
  ).length;
}

function userLikedVideo(videoId) {
  if (!currentUser) return false;

  return videoLikes.some(like =>
    String(like.video_id) === String(videoId) &&
    String(like.user_id) === String(currentUser.id)
  );
}

async function refreshLikes() {
  await loadVideoLikes();

  renderVideos();
  renderShorts();
  renderExplore();
}

// ==========================================
// PROFILE MANAGEMENT
// ==========================================

async function loadProfile() {
  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id,username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile loading error:", error);
    return;
  }

  if (data) {
    document.getElementById("username").value =
      data.username || "";

    document.getElementById("nickname").value =
      data.nickname || "";
  }
}

async function saveProfile() {
  if (!currentUser) {
    showMessage("Please sign in first.", "error");
    return;
  }

  const username = document
    .getElementById("username").value.trim();

  const nickname = document
    .getElementById("nickname").value.trim();

  if (!username) {
    showMessage("Please enter a username.", "error");
    return;
  }

  const { error } = await supabaseClient
    .from("profiles")
    .upsert({
      id: currentUser.id,
      username,
      nickname
    }, {
      onConflict: "id"
    });

  if (error) {
    showMessage("Profile could not be saved: " + error.message, "error");
    return;
  }

  await updateAccountDisplay();

  showMessage("Your profile has been saved.", "success");
}

// ==========================================
// ACCOUNT DISPLAY
// ==========================================

async function updateAccountDisplay() {
  const identity = document.getElementById("identityPreview");
  const handle = document.getElementById("handlePreview");
  const authButton = document.getElementById("authButton");

  if (!currentUser) {
    identity.textContent = "Not signed in";
    handle.textContent = "";
    authButton.textContent = "Account";
    return;
  }

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  identity.textContent =
    currentUser.email || "JIENXS member";

  handle.textContent = profile
    ? "@" + (profile.username || profile.nickname || "member")
    : "JIENXS member";

  authButton.textContent = "My Account";
}

// ==========================================
// CREATE ACCOUNT
// ==========================================

async function createAccount() {
  const email = document
    .getElementById("email").value.trim();

  const password = document
    .getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.", "error");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.", "error");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    showMessage("Sign up failed: " + error.message, "error");
    return;
  }

  if (data.session) {
    currentUser = data.session.user;

    await updateAccountDisplay();
    await loadProfile();
    showMessage("Your account has been created successfully.", "success");
  } else {
    showMessage(
      "Account created. Check your email to confirm your account before signing in.",
      "success"
    );
  }
}

// ==========================================
// SIGN IN
// ==========================================

async function signIn() {
  const email = document
    .getElementById("email").value.trim();

  const password = document
    .getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.", "error");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage("Sign in failed: " + error.message, "error");
    return;
  }

  currentUser = data.user;

  await updateAccountDisplay();
  await loadProfile();
  await loadVideos();

  showMessage("You are now signed in.", "success");
}

// ==========================================
// SIGN OUT
// ==========================================

async function signOut() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    showMessage("Sign out failed: " + error.message, "error");
    return;
  }

  currentUser = null;

  document.getElementById("username").value = "";
  document.getElementById("nickname").value = "";

  await updateAccountDisplay();
  await refreshLikes();

  showMessage("You have signed out.", "success");
}

// ==========================================
// SEARCH AND CATEGORY FILTERS
// ==========================================

function getFilteredVideos() {
  return allVideos.filter(video => {
    const matchesCategory =
      activeCategory === "All" ||
      video.category === activeCategory;

    const text = (
      (video.title || "") + " " +
      (video.description || "") + " " +
      (video.category || "") + " " +
      getCreatorName(video)
    ).toLowerCase();

    const matchesSearch =
      !searchTerm || text.includes(searchTerm.toLowerCase());

    return matchesCategory && matchesSearch;
  });
  }
// ==========================================
// JIENXS PART 3 - VIDEOS, SHORTS, LIKES
// AND COMMENTS
// ==========================================

// ==========================================
// VIDEO CARD
// ==========================================

function createVideoCard(video, mode = "home") {
  const videoId = String(video.id);
  const safeId = escapeHTML(videoId);
  const title = escapeHTML(video.title || "Untitled video");
  const description = escapeHTML(video.description || "");
  const creator = escapeHTML(getCreatorName(video));
  const category = escapeHTML(video.category || "Others");
  const videoUrl = escapeHTML(video.video_url || "");
  const likeCount = getLikeCount(video.id);
  const liked = userLikedVideo(video.id);

  const isShort = mode === "shorts";
  const cardClass = isShort ? "shorts-card" : "video-card";

  return `
    <article class="${cardClass}" data-video-id="${safeId}">
      <video
        controls
        playsinline
        preload="metadata"
        src="${videoUrl}"
      ></video>

      <div class="video-details">
        <div class="video-title">${title}</div>

        <div class="video-creator">
          ${creator} · ${category}
          ${video.created_at ? " · " + escapeHTML(formatDate(video.created_at)) : ""}
        </div>

        ${description ? `<div class="video-description">${description}</div>` : ""}

        <div class="video-actions">
          <button
            class="action-button ${liked ? "liked" : ""}"
            data-action="like"
            data-id="${safeId}"
            aria-pressed="${liked}"
          >${liked ? "♥ Liked" : "♡ Like"}</button>

          <span class="like-count">${likeCount} likes</span>

          <button
            class="action-button"
            data-action="share"
            data-id="${safeId}"
          >↗ Share</button>

          ${currentUser && String(video.creator_id) === String(currentUser.id)
            ? `<button class="action-button" data-action="delete-video" data-id="${safeId}">Delete</button>`
            : ""}
        </div>

        <div class="inline-comments">
          <h4>Comments</h4>

          <div class="comment-list" data-comments-for="${safeId}">
            <div class="muted">Loading comments...</div>
          </div>

          <form class="comment-form" data-comment-form="${safeId}">
            <input
              type="text"
              name="comment"
              maxlength="1000"
              placeholder="${currentUser ? "Write a comment..." : "Sign in to comment"}"
              ${currentUser ? "" : "disabled"}
              required
            >
            <button type="submit" ${currentUser ? "" : "disabled"}>Send</button>
          </form>
        </div>
      </div>
    </article>
  `;
}

// ==========================================
// RENDER HOME VIDEOS
// ==========================================

function renderVideos() {
  const grid = document.getElementById("videoGrid");
  if (!grid) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    grid.innerHTML = `
      <div class="empty-state">
        No videos found yet. Be the first to upload a video!
      </div>
    `;
    return;
  }

  grid.innerHTML = videos
    .map(video => createVideoCard(video, "home"))
    .join("");

  videos.forEach(video => loadComments(video.id));
}

// ==========================================
// RENDER SHORTS
// ==========================================

function renderShorts() {
  const feed = document.getElementById("shortsFeed");
  if (!feed) return;

  // Shorts currently displays the same video collection
  // in a vertical feed, keeping all categories available.
  const videos = getFilteredVideos();

  if (!videos.length) {
    feed.innerHTML = `
      <div class="empty-state">
        No Shorts available yet. Upload a video to get started!
      </div>
    `;
    return;
  }

  feed.innerHTML = videos
    .map(video => createVideoCard(video, "shorts"))
    .join("");

  videos.forEach(video => loadComments(video.id));
}

// ==========================================
// RENDER EXPLORE
// ==========================================

function renderExplore() {
  const grid = document.getElementById("exploreGrid");
  if (!grid) return;

  const videos = getFilteredVideos();

  if (!videos.length) {
    grid.innerHTML = `
      <div class="empty-state">
        No videos to explore yet.
      </div>
    `;
    return;
  }

  grid.innerHTML = videos
    .map(video => createVideoCard(video, "explore"))
    .join("");

  videos.forEach(video => loadComments(video.id));
}

// ==========================================
// LOAD COMMENTS
// ==========================================

async function loadComments(videoId) {
  const { data, error } = await supabaseClient
    .from("comments")
    .select("id,video_id,user_id,creator_name,content,created_at")
    .eq("video_id", videoId)
    .order("created_at", { ascending: true });

  const containers = document.querySelectorAll(
    `[data-comments-for="${CSS.escape(String(videoId))}"]`
  );

  if (error) {
    console.error("Comment loading error:", error);

    containers.forEach(container => {
      container.innerHTML =
        '<div class="muted">Could not load comments.</div>';
    });

    return;
  }

  const comments = data || [];

  const html = comments.length
    ? comments.map(comment => {
        const ownComment =
          currentUser &&
          String(comment.user_id) === String(currentUser.id);

        return `
          <div class="comment-item">
            <div class="comment-name">
              ${escapeHTML(comment.creator_name || "JIENXS Member")}
            </div>

            <div class="comment-content">
              ${escapeHTML(comment.content)}
            </div>

            <div class="comment-date">
              ${escapeHTML(formatDate(comment.created_at))}
            </div>

            ${ownComment
              ? `<button class="comment-delete" data-action="delete-comment" data-id="${escapeHTML(comment.id)}">Delete comment</button>`
              : ""}
          </div>
        `;
      }).join("")
    : '<div class="muted">No comments yet. Start the conversation!</div>';

  // Update every displayed copy of this video's comments.
  containers.forEach(container => {
    container.innerHTML = html;
  });
}

// ADD COMMENT
// ==========================================

async function addComment(videoId, content) {
  if (!currentUser) {
    showMessage("Please sign in to comment.", "error");
    return;
  }

  const cleanContent = content.trim();

  if (!cleanContent) {
    showMessage("Please enter a comment.", "error");
    return;
  }

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  const creatorName =
    profile?.nickname ||
    profile?.username ||
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "JIENXS Member";

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      video_id: videoId,
      user_id: currentUser.id,
      creator_name: creatorName,
      content: cleanContent
    });

  if (error) {
    showMessage("Comment failed: " + error.message, "error");
    return;
  }

  await loadComments(videoId);
  showMessage("Comment added successfully.", "success");
}

// ==========================================
// DELETE COMMENT
// ==========================================

async function deleteComment(commentId) {
  if (!currentUser) return;

  const confirmed = confirm("Delete this comment?");

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("comments")
    .delete()
    .eq("id", commentId)
    .eq("user_id", currentUser.id);

  if (error) {
    showMessage("Could not delete comment: " + error.message, "error");
    return;
  }

  showMessage("Comment deleted.", "success");

  // Reload comments for every displayed video card.
  const containers = document.querySelectorAll("[data-comments-for]");

  containers.forEach(container => {
    const videoId = container.dataset.commentsFor;
    if (videoId) loadComments(videoId);
  });
}

async function toggleLike(videoId) {
  if (!currentUser) {
    showMessage("Please sign in to like videos.", "error");
    return;
  }

  const { data: existingLike, error: checkError } =
    await supabaseClient
      .from("likes")
      .select("video_id,user_id")
      .eq("video_id", videoId)
      .eq("user_id", currentUser.id)
      .limit(1)
      .maybeSingle();

  if (checkError) {
    showMessage("Could not check like: " + checkError.message, "error");
    return;
  }

  if (existingLike) {
    const { error } = await supabaseClient
      .from("likes")
      .delete()
      .eq("video_id", videoId)
      .eq("user_id", currentUser.id);

    if (error) {
      showMessage("Unlike failed: " + error.message, "error");
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from("likes")
      .insert({
        video_id: videoId,
        user_id: currentUser.id
      });

    if (error) {
      showMessage("Like failed: " + error.message, "error");
      return;
    }
  }

  await refreshLikes();
}

// ==========================================

async function getCurrentCreatorName() {
  if (!currentUser) return "JIENXS Creator";

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("username,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Could not load creator profile:", error);
  }

  return (
    profile?.nickname ||
    profile?.username ||
    currentUser.user_metadata?.username ||
    currentUser.user_metadata?.full_name ||
    currentUser.email?.split("@")[0] ||
    "JIENXS Creator"
  );
}

// ==========================================
// UPLOAD VIDEO
// ==========================================

async function uploadVideo() {
  if (isUploading) return;

  if (!currentUser) {
    showMessage(
      "Please sign in before uploading a video.",
      "error",
      "uploadMessage"
    );
    return;
  }

  const title = document
    .getElementById("videoTitle").value.trim();

  const category = document
    .getElementById("videoCategory").value;

  const description = document
    .getElementById("videoDescription").value.trim();

  const fileInput = document.getElementById("videoFile");
  const file = fileInput.files[0];

  if (!title) {
    showMessage("Please enter a video title.", "error", "uploadMessage");
    return;
  }

  if (!file) {
    showMessage("Please select a video file.", "error", "uploadMessage");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showMessage("Please select a valid video file.", "error", "uploadMessage");
    return;
  }

  const maxSize = 100 * 1024 * 1024;

  if (file.size > maxSize) {
    showMessage(
      "Your video is larger than 100 MB. Please choose a smaller video.",
      "error",
      "uploadMessage"
    );
    return;
  }

  isUploading = true;

  const uploadButton = document.getElementById("uploadButton");
  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";

  let uploadedPath = null;

  try {
    showMessage(
      "Preparing your video...",
      "success",
      "uploadMessage"
    );

    const creatorName = await getCurrentCreatorName();

    const extension = file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "mp4";

    const safeExtension = /^[a-z0-9]{1,10}$/.test(extension)
      ? extension
      : "mp4";

    const uniqueName =
      currentUser.id + "/" +
      Date.now() + "-" +
      crypto.randomUUID() + "." +
      safeExtension;

    // Upload video to the public JIENXS storage bucket.
    const { data: storageData, error: storageError } =
      await supabaseClient.storage
        .from("jienxs")
        .upload(uniqueName, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

    if (storageError) throw storageError;

    uploadedPath = storageData.path;

    const { data: publicData } =
      supabaseClient.storage
        .from("jienxs")
        .getPublicUrl(uploadedPath);

    const videoUrl = publicData?.publicUrl;

    if (!videoUrl) {
      throw new Error("Could not create a public video URL.");
    }

    showMessage(
      "Video uploaded. Saving video information...",
      "success",
      "uploadMessage"
    );

    // Insert every required videos-table field.
    const { data: newVideo, error: databaseError } =
      await supabaseClient
        .from("videos")
        .insert({
          title: title,
          description: description,
          category: category,
          video_url: videoUrl,
          creator_id: currentUser.id,
          creator_name: creatorName,
          status: "approved"
        })
        .select()
        .single();

    if (databaseError) throw databaseError;

    // Reset upload form after successful upload.
    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoFile").value = "";

    showMessage(
      "Your video has been uploaded successfully!",
      "success",
      "uploadMessage"
    );

    await loadVideos();
    showPage("home");

  } catch (error) {
    console.error("JIENXS upload error:", error);

    // Remove uploaded file if saving the database record failed.
    if (uploadedPath) {
      const { error: cleanupError } = await supabaseClient.storage
        .from("jienxs")
        .remove([uploadedPath]);

      if (cleanupError) {
        console.error("Storage cleanup error:", cleanupError);
      }
    }

    showMessage(
      "Upload failed: " + (error.message || "Unknown error"),
      "error",
      "uploadMessage"
    );

  } finally {
    isUploading = false;
    uploadButton.disabled = false;
    uploadButton.textContent = "Upload Video";
  }
}

// ==========================================
// DELETE YOUR OWN VIDEO
// ==========================================

async function deleteVideo(videoId) {
  if (!currentUser) {
    showMessage("Please sign in first.", "error");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this video?"
  );

  if (!confirmed) return;

  const { data: video, error: findError } = await supabaseClient
    .from("videos")
    .select("id,video_url,creator_id")
    .eq("id", videoId)
    .eq("creator_id", currentUser.id)
    .maybeSingle();

  if (findError) {
    showMessage("Could not find video: " + findError.message, "error");
    return;
  }

  if (!video) {
    showMessage(
      "Video not found or you do not have permission to delete it.",
      "error"
    );
    return;
  }

  const { error: deleteError } = await supabaseClient
    .from("videos")
    .delete()
    .eq("id", videoId)
    .eq("creator_id", currentUser.id);

  if (deleteError) {
    showMessage("Delete failed: " + deleteError.message, "error");
    return;
  }

  // Remove the corresponding file from public storage.
  const marker = "/storage/v1/object/public/jienxs/";
  const markerIndex = video.video_url.indexOf(marker);

  if (markerIndex !== -1) {
    const storagePath = decodeURIComponent(
      video.video_url.substring(markerIndex + marker.length)
    );

    const { error: storageError } = await supabaseClient.storage
      .from("jienxs")
      .remove([storagePath]);

    if (storageError) {
      console.error("Storage file deletion error:", storageError);
    }
  }

  showMessage("Your video has been deleted.", "success");

  await loadVideos();
}

// ==========================================
// SHARE VIDEO
// ==========================================

async function shareVideo(videoId) {
  const video = allVideos.find(
    item => String(item.id) === String(videoId)
  );

  if (!video) {
    showMessage("Video could not be found.", "error");
    return;
  }

  const shareData = {
    title: video.title || "Watch on JIENXS",
    text: "Watch this video on JIENXS!",
    url: video.video_url
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(video.video_url);
      showMessage("Video link copied successfully.", "success");
    } else {
      showMessage(
        "Sharing is not supported on this browser.",
        "error"
      );
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      console.error("Share error:", error);
      showMessage("Could not share this video.", "error");
    }
  }
  }

document.addEventListener("click", async event => {
  const button = event.target.closest("[data-action]");

  if (!button) return;

  const action = button.dataset.action;
  const videoId = button.dataset.videoId;

  if (!videoId) return;

  if (action === "like") {
    await toggleLike(videoId);
  }

  if (action === "share") {
    await shareVideo(videoId);
  }

  if (action === "delete-video") {
    await deleteVideo(videoId);
  }

  if (action === "delete-comment") {
    const commentId = button.dataset.commentId;

    if (commentId) {
      await deleteComment(commentId);
    }
  }
});

// COMMENT FORMS
// ==========================================

document.addEventListener("submit", async event => {
  const form = event.target.closest("[data-comment-form]");

  if (!form) return;

  event.preventDefault();

  const videoId = form.dataset.videoId;
  const input = form.querySelector(
    'input[name="comment"], textarea[name="comment"], [data-comment-input]'
  );

  if (!videoId || !input) return;

  const content = input.value.trim();

  if (!content) return;

  await addComment(videoId, content);

  input.value = "";
});

// ==========================================

  currentUser = session?.user || null;

  if (currentUser) {
    await loadProfile();
  }

  updateAccountDisplay();

  if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
    await loadVideos();
  }
});

// ==========================================
// START JIENXS
// ==========================================

async function startJIENXS() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

    if (currentUser) {
      await loadProfile();
    }

    updateAccountDisplay();

    await loadVideos();

    const requestedVideo = new URLSearchParams(
      window.location.search
    ).get("video");

    if (requestedVideo) {
      showPage("home");

      setTimeout(() => {
        const videoCard = document.querySelector(
          `[data-video-id="${CSS.escape(requestedVideo)}"]`
        );

        if (videoCard) {
          videoCard.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });
        }
      }, 500);
    }

  } catch (error) {
    console.error("JIENXS startup error:", error);

    showMessage(
      "JIENXS could not load: " + error.message,
      "error"
    );
  }
}

startJIENXS();
